                  sender_name:
                    type: string
                  sender_email:
                    type: string
                  preheader:
                    type: string
                  reply_email_id:
                    type: string
                  attachments:
                    type: array
                    items:
                      type: string
                  template_id:
                    type: integer
                  browser_view:
                    type: boolean
                  mobile_view:
                    type: boolean
                  custom_footer:
                    type: string
          description: '[ANY] This block will be used when Campaign type is split'
        slice_and_send_details:
