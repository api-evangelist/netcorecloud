components:
  schemas:
    ContentDetails:
      type: object
      properties:
        template_id:
          type: string
          description: 'Template ID for the content.


            '
      description: Content details for the campaign. Note - This is not a mandatory block as long as the campaign is in "draft" state
      required:
      - template_id
    OutputBlock:
      type: object
      properties:
        get_count:
          type: boolean
          description: Get count of the results.
        sorting:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                description: Field to be sorted with
              direction:
                type: string
                description: 'Allowed: asc, desc'
          description: Should not be present if get_count is True.
        pagination:
          type: object
          properties:
            page:
              type: integer
              description: The page number
            limit:
              type: integer
              description: Number of results per page
          description: Should not be present if get_count is True. Break search results into segments or pages.
        fields:
          type: array
          items:
            type: string
          description: 'Should not be present if get_count is True. The fields which should be present in the output. Allowed Values : campaign_id, channel, campaign_name, campaign_state, campaign_type, tags, google_analytics, conversion_tracking, audience_details, content_details, frequency_capping, schedule_details, campaign_specific_details'
      required:
      - get_count
    ValidationFailureResponse:
      type: object
      properties:
        request_id:
          type: string
        description:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
            required:
            - field
            - message
        status:
          type: string
        code:
          type: string
      required:
      - request_id
      - description
      - errors
      - status
      - code
