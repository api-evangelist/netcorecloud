              type: string
              description: '[EMAIL] If header type is predefined, header_id should be present.'
            header_string:
              type: string
              description: '[EMAIL] If header type is custom, header_string should be present'
          description: '[EMAIL] Use custom header inside Email Template. Note: Only use this field if both, browser_view and mobile_view are disabled.'
        browser_view:
          type: boolean
