openapi: 3.2.0
info:
  title: Campaigns Campaign API
  description: ''
  version: 1.0.0
servers:
- url: https://netcoreapi-main-prod-us.netcorein.com/v5/
  description: US
- url: ' https://netcoreapi-main-prod-ind.netcorein.com/v5/'
  description: IND
- url: ' https://netcoreapi-main-prod-eu.netcorein.com/v5/'
  description: EU
security:
- ApiKeyAuth: []
tags:
- name: Campaign
paths:
  /campaign/create:
    post:
      summary: Create Campaign
      deprecated: false
      description: 'The Create Campaign API is used to create and configure marketing campaigns across supported communication channels: **Email, APN (App Push Notifications), BPN (Browser Push Notifications), SMS, and WhatsApp**.'
      tags:
      - Campaign
      parameters:
      - name: api-key
        in: header
        description: Api Key to be used for authentication and authorization
        required: true
        example: a87136e33b5126b31b3135ce4e06a455
        schema:
          type: string
          pattern: ^[a-f0-9]{32}$
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  description: click on the **+** icon to add objects
                  properties:
                    campaigns:
                      type: array
                      items:
                        type: object
                        properties:
                          channel:
                            type: string
                            description: 'The channel through which the campaign will be sent.**Note** Allowed values: Email, APN, BPN, SMS, WhatsApp.'
                            example:
                            - Email
                            - APN
                            - BPN
                            - SMS
                            - WhatsApp
                          campaign_name:
                            type: string
                            description: Name of the campaign. As best practice please ensure to provide unique names for better readability. Allowed Characters - 0-9, a-z, A-Z, -, _, &, @. Maximum character limit is 100.
                            example: Test_Create_Campaign
                          campaign_state:
                            type: string
                            description: While creating a Campaign, campaign_state can have values - draft - When the campaign is still being worked on; schedule - Once all campaign is ready to be published
                          campaign_type:
                            type: string
                            description: 'Type of the campaign.

                              Note - amp, a/b split, split are in development

                              Allowed values: regular, amp, a/b split, split'
                          tags:
                            type: string
                            description: List of tags associated with the campaign. Optional additional tagging for tracking purpose
                          google_analytics:
                            $ref: '#/components/schemas/GoogleAnalytics'
                            description: 'Google Analytics Tracking. '
                          conversion_tracking:
                            $ref: '#/components/schemas/ConversionTracking'
                            description: 'Conversion details for the campaign. '
                          deduplication:
                            type: boolean
                            description: 'Deduplication. Default value: False. For channels: Email, SMS, Whatsapp'
                          audience_details:
                            $ref: '#/components/schemas/AudienceDetails'
                            description: Details of the audience for the campaign. Section to specify Audience Details to be included or excluded for the campaign via Contact Master, List IDs, Segment IDs or UDT ID
                          frequency_capping:
                            $ref: '#/components/schemas/FrequencyCapping'
                            description: This is used to manage how often a campaign is sent to the same user. Limit the number of times a user can receive the campaign within a specified time frame. Details of sub-parameter is provided below.
                          content_details:
                            $ref: '#/components/schemas/ContentDetails'
                            description: Content details for the campaign.
                          schedule_details:
                            $ref: '#/components/schemas/ScheduleDetails'
                            description: Schedule details for the campaign.
                          campaign_specific_details:
                            $ref: '#/components/schemas/CampaignSpecific'
                            description: Specific details for the campaign.
                        required:
                        - channel
                        - campaign_name
                        - campaign_state
                        - campaign_type
                        - tags
                        - google_analytics
                        - conversion_tracking
                        - audience_details
                        - frequency_capping
                        - content_details
                        - schedule_details
                        - campaign_specific_details
                  required:
                  - campaigns
                notify_callback:
                  description: Notification and callback details. This block is manditory. The sub-blocks, notify and callback are optional. Use either one or both of these sub-blocks. However, one of them is mandatory.
                  type: object
                  properties:
                    notify:
                      type: object
                      properties:
                        email:
                          type: string
                          description: Email address for notifications.
                          pattern: ^([a-z0-9_])([a-z0-9\+_\-]+)*(\.[a-z0-9\+_\-]+)*@([a-z0-9\-]+\.)+[a-z]{2,25}$
                          example:
                          - taaha.multani@netcorecloud.com
                    callback:
                      type: array
                      items:
                        type: object
                        properties:
                          url:
                            type: string
                            description: Callback URL. Please make sure its HTTPS.
                            example:
                            - https://hkdk.events/*
                            pattern: ^https:\/\/[a-zA-Z0-9.-]+\.[a-zA-Z]{2,6}(?:\/[^\s]{0,2036})?$
                            minLength: 12
                            maxLength: 2048
                          method:
                            type: string
                            description: HTTP method for the callback. Only POST is allowed.
                            example:
                            - POST
                          headers:
                            type: object
                            properties:
                              key1:
                                type: string
                                pattern: ^[a-zA-Z0-9\s._\-@#&():,?/=+]{1,255}$
                                minLength: 1
                                maxLength: 255
                              key2:
                                type: string
                                pattern: ^[a-zA-Z0-9\s._\-@#&():,?/=+]{1,255}$
                                minLength: 1
                                maxLength: 255
                            description: 'To specify header details for the callback. For example key, value could be "Content-Type": "application/json" or                     "Authorization": "Bearer <token>"'
                          body_params:
                            type: object
                            properties:
                              key1:
                                type: string
                                pattern: ^[a-zA-Z0-9\s._\-@#&():,?/=+]{1,255}$
                                minLength: 1
                                maxLength: 255
                              key2:
                                type: string
                                pattern: ^[a-zA-Z0-9\s._\-@#&():,?/=+]{1,255}$
                                minLength: 1
                                maxLength: 255
                            description: 'To specify body details for the callback. For example key, value could be "message": "success"'
                          query_params:
                            type: object
                            properties:
                              key1:
                                type: string
                                pattern: ^[a-zA-Z0-9\s._\-@#&():,?/=+]{1,255}$
                                minLength: 1
                                maxLength: 255
                              key2:
                                type: string
                                pattern: ^[a-zA-Z0-9\s._\-@#&():,?/=+]{1,255}$
                                minLength: 1
                                maxLength: 255
                            description: 'To specify query param details for the callback. For example key, value could be "token": "AKEF54G"'
              required:
              - data
              - notify_callback
            example:
              '1':
                value:
                  data:
                    campaigns:
                    - channel: email
                      campaign_name: TM - Test 1
                      campaign_state: schedule
                      campaign_type: regular
                      tags:
                      - TM
                      google_analytics:
                        enable_ga_tracking: false
                      conversion_tracking:
                        enable_conversion_tracking: false
                      audience_details:
                        include_audience:
                          contact_master: false
                          data:
                          - id:
                            - 2
                            name:
                            - email_pod_list
                            audience_type: list
                        exclude_audience:
                          data: []
                      content_details:
                        template_id: 12
                      frequency_capping:
                        enable_frequency_capping: false
                      schedule_details:
                        schedule_type: now
                      campaign_specific_details:
                        audience_limit: 10
                        subject: Sample Sub
                        domain_filter:
                          enable_domain_filter: false
                        sender_details:
                          sender_name: taaha
                          sender_email: taaha@m3m.in
                  notify_callback:
                    notify:
                      email:
                      - taaha.multani@netcorecloud.com
                      - prashant.pawae@netcorecloud.com
                    callback:
                    - url: https://hkdk.events/hap8uawn6vg4ja
                      method: POST
                      headers:
                        Content-Type: application/json
                        Authorization: Bearer <token>
                      body_params:
                        key1: value1
                        key2: value2
                        key3: value3
                      query_params:
                        param1: value1
                        param2: value2
                    - url: https://client.com/callbackurl.php
                      method: POST
                      headers:
                        Content-Type: application/json
                        Authorization: Bearer <token>
                      body_params:
                        key1: value1
                        key2: value2
                        key3: value3
                      query_params:
                        param1: value1
                        param2: value2
                description: ''
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        campaign_id:
                          type: integer
                        campaign_name:
                          type: string
                        channel:
                          type: string
                  request_id:
                    type: string
                  description:
                    type: string
                    title: ''
                  status:
                    type: string
                  code:
                    type: string
                required:
                - data
                - request_id
                - description
                - status
                - code
              example:
                '1':
                  summary: Create Email Success
                  value:
                    data:
                    - campaign_id: 413
                      campaign_name: TM - Test 1
                      channel: email
                    request_id: 0193af17-9c17-73be-b1f3-dc360eeb908d
                    description: Campaign Created Successfully
                    status: Success
                    code: 200
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailureResponse'
              example:
                '2':
                  summary: System Config Validation Failure
                  value:
                    request_id: 0193afe5-95c8-727a-8b23-5d1cf5735ed3
                    description: System Configuration Validation Failure.
                    status: Success
                    code: 200
                    errors:
                    - field: data[0].frequency_capping.enable_frequency_capping
                      message: Frequency capping is not enabled for this client
                    - field: data[0].tags
                      message: Tags are mandatory for this client
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                title: ''
                type: object
                properties:
                  request_id:
                    type: string
                  description:
                    type: string
                  error:
                    type: string
                  code:
                    type: integer
                required:
                - request_id
                - description
                - error
                - code
              example:
                '3':
                  summary: API Key invalid
                  value:
                    request_id: 01942bff-fb81-7a03-89d3-916e8097c48b
                    description: Unauthorized
                    status: Success
                    code: 200
          headers: {}
        '405':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorsResponse'
              example:
                '4':
                  summary: Method Not Allowed
                  value:
                    request_id: 0193af65-4d80-743a-a296-2805ecd590b4
                    description: Method Not Allowed
                    status: Success
                    code: 200
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorsResponse'
              example:
                '5':
                  summary: Database connection failure
                  value:
                    request_id: 0193af65-4d80-743a-a296-2805ecd590b4
                    description: Internal Server Error
                    status: Success
                    code: 200
          headers: {}
      security:
      - ApiKeyAuth: []
      operationId: postCampaignCreate
      x-operation-id-source: derived
  /campaign/delete:
    post:
      summary: Delete Campaign
      deprecated: false
      description: Delete Campaign.
      tags:
      - Campaign
      parameters:
      - name: api-key
        in: header
        description: ''
        required: true
        example: ''
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                filtering_criteria_operator:
                  type: string
                  description: 'Allowed : and, or'
                filtering_criteria:
                  type: array
                  items:
                    type: object
                    properties:
                      condition_operator:
                        type: string
                        description: 'Allowed : and, or'
                      condition_details:
                        type: array
                        items:
                          type: object
                          properties:
                            field:
                              type: string
                              description: 'Field Name '
                            field_category:
                              type: string
                              description: 'Allowed : Channel Name. Fields which are epcific to channel need this key to be present to be searched successfully.'
                            operation:
                              type: string
                              description: 'Allowed : "equals" | "not_equals" | "greater_than" | "less_than" | "greater_than_or_equal_to" | "less_than_or_equal_to" | "between" | "in" | "not_in" | "contains" | "does_not_contain" | "starts_with" | "ends_with" | "is_null" | "is_not_null" | "matches_regex"'
                            value:
                              type: array
                              items:
                                type: string
                          required:
                          - field
                          - operation
                          - value
                    required:
                    - condition_operator
                    - condition_details
              required:
              - filtering_criteria_operator
              - filtering_criteria
            example:
              '1':
                value:
                  filtering_criteria_operator: or
                  filtering_criteria:
                  - condition_operator: and
                    condition_details:
                    - field: campaign_id
                      operation: equals
                      value:
                      - 2
                      - 4
                description: ''
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
          headers: {}
      security:
      - ApiKeyAuth: []
      operationId: postCampaignDelete
      x-operation-id-source: derived
  /campaign/duplicate:
    post:
      summary: Duplicate Campaign
      deprecated: false
      description: ''
      tags:
      - Campaign
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterBlock'
          headers: {}
      security:
      - ApiKeyAuth: []
      operationId: postCampaignDuplicate
      x-operation-id-source: derived
  /campaign/search:
    post:
      summary: Search Campaign
      deprecated: false
      description: ''
      tags:
      - Campaign
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                filtering_criteria_operator:
                  type: string
                  description: 'Allowed : and, or'
                filtering_criteria:
                  type: array
                  items:
                    type: object
                    properties:
                      condition_operator:
                        type: string
                        description: 'Allowed : and, or'
                      condition_details:
                        type: array
                        items:
                          type: object
                          properties:
                            field:
                              type: string
                              description: 'Field Name '
                            field_category:
                              type: string
                              description: 'Allowed : Channel Name. Fields which are epcific to channel need this key to be present to be searched successfully.'
                            operation:
                              type: string
                              description: 'Allowed : "equals" | "not_equals" | "greater_than" | "less_than" | "greater_than_or_equal_to" | "less_than_or_equal_to" | "between" | "in" | "not_in" | "contains" | "does_not_contain" | "starts_with" | "ends_with" | "is_null" | "is_not_null" | "matches_regex"'
                            value:
                              type: array
                              items:
                                type: string
                          required:
                          - field
                          - operation
                          - value
                    required:
                    - condition_operator
                    - condition_details
                output:
                  $ref: '#/components/schemas/OutputBlock'
              required:
              - filtering_criteria_operator
              - filtering_criteria
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
          headers: {}
      security:
      - ApiKeyAuth: []
      operationId: postCampaignSearch
      x-operation-id-source: derived
  /campaign/suspend:
    post:
      summary: Suspend Campaign
      deprecated: false
      description: ''
      tags:
      - Campaign
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      channel:
                        type: string
                      campaign_ids:
                        type: array
                        items:
                          type: string
                    required:
                    - channel
                    - campaign_ids
                required:
                - data
              example:
                '1':
                  summary: Success
                  description: ''
                  value:
                    request_id: 0195850f-e980-7b02-a64c-2b2af03870ed
                    description: Campaigns Suspended Successfully
                    code: 200
                    status: success
                    data:
                    - campaign_id: 3177
                      channel: email
                '2':
                  summary: Validation Error
                  description: ''
                  value:
                    request_id: 0195850e-1b5f-7a83-aa6e-ef6044367428
                    description: 'Validation Failure: Error during suspend campaign. Please refer to https://developer.netcorecloud.com/docs/test-link-for-api'
                    code: 400
                    status: failed
                    errors:
                    - field: campaign_ids
                      message: 'Failed. The following campaign_ids are invalid. Kindly provide the correct Campaign ID available on your panel: 11111'
                    - field: campaign_ids
                      message: 'Failed. The following campaign_ids do not have a valid status for deletion: 3176'
          headers: {}
      security:
      - ApiKeyAuth: []
      operationId: postCampaignSuspend
      x-operation-id-source: derived
  /campaign/test:
    post:
      summary: Test Campaign
      deprecated: false
      tags:
      - Campaign
      parameters:
      - name: api-key
        in: header
        description: ''
        required: true
        example: ''
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    campaigns:
                      type: array
                      items:
                        $ref: '#/components/schemas/TestCampaign'
                  required:
                  - campaigns
              required:
              - data
            example:
              '1':
                value:
                  data:
                    campaigns:
                    - campaign_id: 490
                      channel: email
                      test_user_details:
                        test_type: primary_key
                        targets:
                        - taaha.multani@netcorecloud.com
                        - devtaaha@gmail.com
                description: ''
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        campaign_id:
                          type: integer
                        channel:
                          type: string
                  request_id:
                    type: string
                  description:
                    type: string
                required:
                - data
                - request_id
                - description
              example:
                '1':
                  summary: Success
                  value:
                    data:
                    - campaign_id: 490
                      channel: email
                    request_id: 01943a1b-25f8-7af7-973b-750c80abf6b6
                    description: Test Campaign Successfully
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailureResponse'
              example:
                '2':
                  summary: Multiple Campaigns sent
                  value:
                    request_id: 01943a2f-318e-7dee-a8f2-05944cf06c7b
                    description: Test Campaign Validation Failure. Please refer to https://netcorecloud.stoplight.io/docs/netcore-campaign-v5-apis/p955mlprc0jdt-create-a-campaign
                    errors:
                    - field: data[0]
                      message: Only one campaign can be tested at a time. Please send only one campaign inside the data block.
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorsResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorsResponse'
          headers: {}
      security:
      - ApiKeyAuth: []
      operationId: postCampaignTest
      x-operation-id-source: derived
  /campaign/update:
    post:
      summary: Update Campaign
      deprecated: false
      description: Update campaign documentation with example.
      tags:
      - Campaign
      parameters:
      - name: api-key
        in: header
        description: Api Key to be used for authentication and authorization
        required: true
        example: ''
        schema:
          type: string
          pattern: ^[a-f0-9]{32}$
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    campaigns:
                      type: array
                      items:
                        type: object
                        properties:
                          campaign_id:
                            type: string
                            description: The campaign ID to be updated.
                          channel:
                            type: string
                            description: 'When updating the campaign, channel cannot be changed. The channel through which the campaign will be sent. Note: BPN, SMS, whatsapp are in development. Allowed values: email, apn, bpn, sms, whatsapp'
                          campaign_name:
                            type: string
                            description: Name of the campaign. As best practice please ensure to provide unique names for better readability. Allowed Characters - 0-9, a-z, A-Z, -, _, &, @. Maximum character limit is 100.
                          campaign_state:
                            type: string
                            description: When updating the campaign, campaigns which are in scheduled state cannot be updated. They need to be suspended, then updated.
                          campaign_type:
                            type: string
                            description: 'When updating a campaign, campaign_type cannot be changed. Type of the campaign.

                              Note - amp, a/b split, split are in development

                              Allowed values: regular, amp, a/b split, split'
                          tags:
                            type: string
                            description: List of tags associated with the campaign. Optional additional tagging for tracking purpose
                          google_analytics:
                            $ref: '#/components/schemas/GoogleAnalytics'
                            description: 'Google Analytics Tracking. '
                          conversion_tracking:
                            $ref: '#/components/schemas/ConversionTracking'
                            description: 'Conversion details for the campaign. '
                          deduplication:
                            type: boolean
                            description: 'Deduplication. Default value: False. For channels: Email, SMS, Whatsapp'
                          audience_details:
                            $ref: '#/components/schemas/AudienceDetails'
                            description: Details of the audience for the campaign. Section to specify Audience Details to be included or excluded for the campaign via Contact Master, List IDs, Segment IDs or UDT ID
                          frequency_capping:
                            $ref: '#/components/schemas/FrequencyCapping'
                            description: This is used to manage how often a campaign is sent to the same user. Limit the number of times a user can receive the campaign within a specified time frame. Details of sub-parameter is provided below.
                          content_details:
                            $ref: '#/components/schemas/ContentDetails'
                            description: Content details for the campaign.
                          schedule_details:
                            $ref: '#/components/schemas/ScheduleDetails'
                            description: Schedule details for the campaign.
                          campaign_specific_details:
                            $ref: '#/components/schemas/CampaignSpecific'
                            description: Specific details for the campaign.
                        required:
                        - channel
                        - campaign_name
                        - campaign_state
                        - campaign_type
                        - tags
                        - google_analytics
                        - conversion_tracking
                        - audience_details
                        - frequency_capping
                        - content_details
                        - schedule_details
                        - campaign_specific_details
                        - campaign_id
                  required:
                  - campaigns
                notify_callback:
                  description: Notification and callback details. This block is manditory. The sub-blocks, notify and callback are optional. Use either one or both of these sub-blocks. However, one of them is mandatory.
                  type: object
                  properties:
                    notify:
                      type: object
                      properties:
                        email:
                          type: string
                          description: Email address for notifications.
                          pattern: ^([a-z0-9_])([a-z0-9\+_\-]+)*(\.[a-z0-9\+_\-]+)*@([a-z0-9\-]+\.)+[a-z]{2,25}$
                          example:
                          - taaha.multani@netcorecloud.com
                    callback:
                      type: array
                      items:
                        type: object
                        properties:
                          url:
                            type: string
                            description: Callback URL. Please make sure its HTTPS.
                            example:
                            - https://hkdk.events/*
                            pattern: ^https:\/\/[a-zA-Z0-9.-]+\.[a-zA-Z]{2,6}(?:\/[^\s]{0,2036})?$
                            minLength: 12
                            maxLength: 2048
                          method:
                            type: string
                            description: HTTP method for the callback. Only POST is allowed.
                            example:
                            - POST
                          headers:
                            type: object
                            properties:
                              key1:
                                type: string
                                pattern: ^[a-zA-Z0-9\s._\-@#&():,?/=+]{1,255}$
                                minLength: 1
                                maxLength: 255
                              key2:
                                type: string
                                pattern: ^[a-zA-Z0-9\s._\-@#&():,?/=+]{1,255}$
                                minLength: 1
                                maxLength: 255
                            description: 'To specify header details for the callback. For example key, value could be "Content-Type": "application/json" or                     "Authorization": "Bearer <token>"'
                          body_params:
                            type: object
                            properties:
