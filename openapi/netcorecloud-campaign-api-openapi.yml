              description: '[EMAIL]'
            reply_email:
              type: string
              description: '[EMAIL]'
            cc:
              type: string
              description: '[EMAIL]'
            channel_id:
              type: integer
              description: '[SMS] Channel_id which comes from bizbond'
            sender_id:
              type: string
              description: '[SMS] Sender_id which falls under channel_id'
            custom_domain:
              type: string
              description: '[SMS] Custom Domain for sms (Can be null)'
            business_number:
              type: integer
              description: '[WHATSAPP]  Business number to be used'
