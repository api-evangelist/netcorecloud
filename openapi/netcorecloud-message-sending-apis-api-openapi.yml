openapi: 3.2.0
info:
  title: RCS Message Sending APIs API
  version: '1.0'
  description: Comprehensive collection of RCS APIs that allow users to interact with .
  license:
    name: Proprietary
    identifier: proprietary
servers:
- url: https://soipapi.netcorecloud.com
  description: WhatsApp APIs Server
tags:
- name: Message Sending APIs
paths:
  /soip/rcs/v2/message:
    parameters: []
    post:
      summary: Template Message API
      tags:
      - Message Sending APIs
      operationId: postSoipRcsV2Message
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  messageId:
                    type: string
                  requestError:
                    type: object
                    properties:
                      serviceException:
                        type: object
                        properties:
                          messageId:
                            type: string
                          text:
                            type: string
                          validationErrors:
                            type: 'null'
                x-examples:
                  Example 1:
                    messageId: 8c5581b49869d0ebfed7e2d98c63f9dc
                    requestError:
                      serviceException:
                        messageId: ''
                        text: ''
                        validationErrors: null
              examples:
                Example 1:
                  value:
                    messageId: string
                    requestError:
                      serviceException:
                        messageId: string
                        text: string
                        validationErrors: null
            application/xml:
              schema:
                type: object
                properties: {}
        '400':
          description: "content type not valid header must contain \"Content-Type\" as \"application/json\"\n\n \n{\n    \"requestError\": {\n        \"serviceException\": {\n            \"messageId\": \"\",\n            \"text\": \"ContentType not valid\",\n            \"validationErrors\": null\n        }\n    }\n}\n"
        '401':
          description: "Unauthenticated: apikey not found/ unable to get feedid/clientid check if api_key is correct, if yes, contact SRE to for onboarding.\n\n{\n    \"requestError\": {\n        \"serviceException\": {\n            \"messageId\": \"8f1500e4319ee7ab4b0ff04103cce250\",\n            \"text\": \"Unauthenticated: apikey not found/ unable to get feedid/clientid\",\n            \"validationErrors\": [\n                \"apikey not valid\"\n            ]\n        }\n    }\n}\n"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              x-examples:
                Example 1:
                  messages:
                  - to: '918983190458'
                    content:
                      type: template
                      templateCode: employee_campaign
                      attributes:
                        FIRSTNAME: Akash
                    callbackData: '7890986'
                    ttl: 10s
                    expireTime: '2023-06-20T15:39:30Z'
                    tags:
                    - '12'
                  fallbackchain:
                  - channel: RCS
                  - from: Travel agent
                    channel: SMS
                    text: Test Messages [FIRSTNAME] 😘🫣👿😻🤬 Netcore
                Non Template Text Message:
