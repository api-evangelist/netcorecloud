                        type: REPLY
                    callbackData: '7890986'
                    tags:
                    - '12'
                  fallbackstatus: true
                  fallbackchain:
                  - from: Travel agency
                    channel: RCS
                Rich Card Message:
                  messages:
                  - To: '919999999999'
                    content:
