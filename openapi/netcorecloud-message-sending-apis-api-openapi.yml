                                      - REQUEST_LOCATION
                                      - OPEN_URL
                                      description: Type of suggestion action
                                    phoneNumber:
                                      type: string
                                      description: Phone number for DIAL_PHONE type (required for DIAL_PHONE)
                                    latitude:
                                      type: number
                                      format: float
                                      description: Latitude for SHOW_LOCATION type (required for SHOW_LOCATION)
                                    longitude:
                                      type: number
                                      format: float
                                      description: Longitude for SHOW_LOCATION type (required for SHOW_LOCATION)
                                    label:
                                      type: string
                                      description: Label for SHOW_LOCATION type
                                    url:
                                      type: string
                                      format: uri
                                      description: URL for OPEN_URL type (required for OPEN_URL)
                          cardWidth:
                            type: string
                            enum:
                            - SMALL
                            - MEDIUM
                            - LARGE
                            description: Width of the card (for CAROUSEL type)
                          contents:
                            type: array
                            description: Array of card contents (for CAROUSEL type)
                            items:
                              type: object
                              properties:
                                title:
                                  type: string
                                  description: Title of the card
                                description:
                                  type: string
