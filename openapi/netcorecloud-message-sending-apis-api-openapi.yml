              properties:
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      To:
                        type: string
                        description: Recipient phone number in E.164 format (uppercase, for freeform messages)
                      to:
                        type: string
                        description: Recipient phone number in E.164 format (lowercase, for template messages)
                      content:
                        type: object
                        properties:
                          type:
                            type: string
                            enum:
                            - template
                            - text
                            - CAROUSEL
                            - CARD
                            - FILE
                            - TEXT
                            description: Type of message content
                          templateCode:
                            type: string
                            description: Template code for template type messages
                          attributes:
                            type: object
                            description: Template attributes for template type messages
                            properties:
                              FIRSTNAME:
                                type: string
                          text:
                            type: string
                            description: Text content for TEXT type messages
                          file:
                            type: object
                            description: File object for FILE type messages
                            properties:
                              url:
                                type: string
                                format: uri
                                description: URL of the file
                          thumbnail:
                            type: object
                            description: Thumbnail for FILE type messages
                            properties:
                              url:
                                type: string
                                format: uri
                                description: URL of the thumbnail image
                          Suggestions:
                            type: array
                            description: Array of suggestion chips (capital S for TEXT and FILE types)
                            items:
                              type: object
                              properties:
                                text:
                                  type: string
                                  description: Display text of the suggestion
                                postbackData:
                                  type: string
                                  description: Data to be sent back when suggestion is clicked
                                postbackdata:
                                  type: string
                                  description: Data to be sent back when suggestion is clicked (lowercase variant)
                                type:
                                  type: string
                                  enum:
                                  - REPLY
                                  - DIAL_PHONE
                                  - SHOW_LOCATION
                                  - REQUEST_LOCATION
                                  - OPEN_URL
                                  description: Type of suggestion action
                                phoneNumber:
                                  type: string
                                  description: Phone number for DIAL_PHONE type (required for DIAL_PHONE)
                                latitude:
                                  type: number
                                  format: float
                                  description: Latitude for SHOW_LOCATION type (required for SHOW_LOCATION)
                                longitude:
                                  type: number
                                  format: float
                                  description: Longitude for SHOW_LOCATION type (required for SHOW_LOCATION)
                                label:
                                  type: string
                                  description: Label for SHOW_LOCATION type
                                url:
                                  type: string
                                  format: uri
                                  description: URL for OPEN_URL type (required for OPEN_URL)
                          orientation:
                            type: string
                            enum:
                            - vertical
                            - horizontal
                            description: Orientation for CARD type messages
                          alignment:
                            type: string
                            enum:
                            - left
                            - right
                            - center
                            description: Alignment for CARD type messages
                          content:
                            type: object
                            description: Content object for CARD type messages
                            properties:
