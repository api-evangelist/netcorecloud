                                      label:
                                        type: string
                                        description: Label for SHOW_LOCATION type
                                      url:
                                        type: string
                                        format: uri
                                        description: URL for OPEN_URL type (required for OPEN_URL)
                      callbackData:
                        type: string
                        description: Callback data to be returned in webhook
                      ttl:
                        type: string
                        description: Define the timeline before the campaign expires. The duration must be at least 1800 seconds. If both `ttl` and `expireTime` parameters are provided, `expireTime` takes precedence. This field is optional.
                      expireTime:
                        type: string
                        description: Specifies the absolute timestamp after which the message expires. The value must be in UTC. This field is optional.
                      tags:
                        type: array
                        items:
                          type: string
                        description: Tags for message categorization
