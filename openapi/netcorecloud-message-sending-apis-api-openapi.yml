                                properties:
                                  file:
                                    type: object
                                    properties:
                                      url:
                                        type: string
                                        format: uri
                                        description: URL of the media file
                                  thumbnail:
                                    type: object
                                    properties:
                                      url:
                                        type: string
                                        format: uri
                                        description: URL of the thumbnail image
                                  height:
                                    type: string
                                    enum:
                                    - SHORT
                                    - MEDIUM
                                    - TALL
                                    description: Height of the media
                              suggestions:
                                type: array
                                description: Array of suggestion chips for CARD type
                                items:
                                  type: object
                                  properties:
                                    text:
