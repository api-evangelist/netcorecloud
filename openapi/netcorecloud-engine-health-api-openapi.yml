openapi: 3.2.0
info:
  title: Orbit Router Engine — Health API
  version: 1.0.0
  description: Complete API specification for the Orbit Router email routing platform.
  contact:
    name: Orbit Engineering
  license:
    name: Proprietary
servers:
- url: https://orbitus.netcorecloud.com
  description: Production — Orbit Engine (HTTP Relay)
- url: https://orbitus.netcorecloud.com/apiorbit
  description: Production — Orbit Backend (Config & Management)
security: []
tags:
- name: Engine — Health
paths:
  /metrics:
    get:
      operationId: getMetrics
      tags:
      - Engine — Health
      summary: Server metrics
      description: Returns server-wide counters including total requests, successes, failures, in-flight, and uptime.
      security: []
      responses:
        '200':
          description: Current server metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
  /health:
    get:
      operationId: healthCheck
      tags:
      - Engine — Health
      summary: Health check
      description: Returns server health status. Use for load-balancer health checks.
      security: []
      responses:
        '200':
          description: Server is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /healthz:
    get:
      operationId: healthCheckZ
      tags:
      - Engine — Health
      summary: Health check (alternate)
      description: Alternate health endpoint; identical to `/health`.
      security: []
      responses:
        '200':
          description: Server is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
components:
  schemas:
    MetricsResponse:
      type: object
      properties:
        total_requests:
          type: integer
          example: 15230
        success_requests:
          type: integer
          example: 14980
        failed_requests:
          type: integer
          example: 250
        in_flight:
          type: integer
          example: 3
        uptime_seconds:
          type: integer
          example: 86400
  securitySchemes:
    BackendJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT token obtained from `POST /auth/login`. Access token lifetime: 15 minutes.

        Claims: `user_id`, `client_id`, `role`, `jti`, `exp`, `iat`.

        '
    EngineApiKeyBearer:
      type: http
      scheme: bearer
      description: 'Engine API key via `Authorization: Bearer <api_key>` (priority 1).'
    EngineApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: Engine API key via `X-API-Key` header (priority 2).
    EngineApiKeyFallback:
      type: apiKey
      in: header
      name: api_key
      description: Engine API key via `api_key` header (priority 3, fallback).
x-readme:
  explorer-enabled: true
  proxy-enabled: true
x-provenance:
  method: searched
  source: https://emaildocs.netcorecloud.com/reference
  note: Verbatim OpenAPI fragments embedded in each ReadMe reference page on emaildocs.netcorecloud.com, merged by path. Not authored by API Evangelist.
  retrieved: '2026-10-13'
