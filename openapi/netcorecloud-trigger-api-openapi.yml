                - code
                - status
                - description
              examples:
                '1':
                  summary: Publish Trigger - APN - Success
                  value:
                    request_id: a7add3e4-2206-49f6-927e-3dfd917b906a
                    code: 200
                    status: success
                    description: Your request was accepted successfully. It may take a few minutes to process your request.
          headers: {}
