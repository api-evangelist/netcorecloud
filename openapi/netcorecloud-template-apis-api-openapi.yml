openapi: 3.2.0
info:
  title: Netcorecloud Template APIs API
  version: '1.0'
  description: 'Operations tagged Template APIs across 2 of this provider''s published API definitions: netcorecloud-email-api-v6-openapi.yml, netcorecloud-rcs-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://emailapi.netcorecloud.net/v6
  description: For Non EU region
- url: https://apieu.netcorecloud.net/v6
  description: For EU region
- url: https://soipapi.netcorecloud.com
  description: WhatsApp APIs Server
tags:
- name: Template APIs
paths:
  /templates:
    post:
      summary: Create New Template
      deprecated: false
      description: This endpoint allows you to create a new email template that can later be used to send emails. Only the first HTML content block is stored.
      operationId: create-template
      tags:
      - Template APIs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - content
              properties:
                name:
                  type: string
                  description: 'Unique name of the template. Cannot be empty.

                    '
                  example: Welcome Email
                content:
                  type: array
                  minItems: 1
                  description: 'Array of content blocks. Only the first block of type "html" will be stored.

                    '
                  items:
                    type: object
                    required:
                    - type
                    - value
                    properties:
                      type:
                        type: string
                        enum:
                        - html
                        description: Content type. Only "html" is supported.
                        example: html
                      value:
                        type: string
                        maxLength: 10485760
                        description: 'URL-encoded HTML content of the template. Cannot be empty. Max size: 10MB.

                          '
                        example: <html><body>Welcome to our service!</body></html>
      responses:
        '201':
          description: Template has been created successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - name
                - added
                - updated_at
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  added:
                    type: string
                  updated_at:
                    type: string
              examples:
                Success:
                  value:
                    id: '33837'
                    name: Welcome Email
                    added: '2022-07-13T14:41:48Z'
                    updated_at: '2022-07-13T14:41:51Z'
        '400':
          description: Bad Request. Validation or input errors occurred.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                        field:
                          type: string
              examples:
                Invalid Type:
                  value:
                    error:
                    - message: invalid content type
                      field: type
                Duplicate Name:
                  value:
                    error:
                    - message: duplicate template name
                      field: name
      security:
      - bearer: []
    get:
      summary: Retrieve All Templates
      deprecated: false
      description: Retrieves a list of all templates.
      operationId: get-templates
      tags:
      - Template APIs
      parameters:
      - name: limit
        in: query
        description: ''
        required: false
        schema:
          type: integer
          maximum: 1000
      - name: offset
        in: query
        description: ''
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        added:
                          type: string
                        updated_at:
                          type: string
                x-examples:
                  Example 1:
                    result:
                    - id: '33981'
                      name: adadasd
                      added: '2022-07-29T19:42:29Z'
                      updated_at: '2022-07-29T19:42:32Z'
                    - id: '44125'
                      name: akash
                      added: '2023-12-02T22:11:02Z'
                      updated_at: '2023-12-02T22:11:02Z'
              example:
                result:
                - id: string
                  name: string
                  added: string
                  updated_at: string
          headers: {}
      security:
      - bearer: []
    servers:
    - url: https://emailapi.netcorecloud.net/v6
      description: For Non EU region
    - url: https://apieu.netcorecloud.net/v6
      description: For EU region
  /templates/{template_id}:
    delete:
      summary: Delete Template
      deprecated: false
      description: This endpoint allows you to permanently delete an email template using its unique template ID. Once deleted, the template cannot be recovered.
      operationId: delete-template-by-id
      tags:
      - Template APIs
      parameters:
      - name: template_id
        in: path
        description: The unique ID of the template to delete.
        required: true
        example: '123'
        schema:
          type: string
      responses:
        '204':
          description: No Content. Template deleted successfully. No response body is returned.
          headers: {}
        '400':
          description: Bad Request. Invalid or missing template ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                        field:
                          type: string
              examples:
                Error:
                  value:
                    error:
                    - message: invalid template id
                      field: template_id
          headers: {}
      security:
      - bearer: []
    get:
      summary: Get Template by ID
      deprecated: false
      description: This API endpoint fetches a specific template by its unique ID.
      operationId: get-templates-single
      tags:
      - Template APIs
      parameters:
      - name: template_id
        in: path
        description: The unique ID of the template to retrieve.
        required: true
        example: '123'
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  added:
                    type: string
                  updated_at:
                    type: string
              examples:
                Success:
                  value:
                    id: '123'
                    name: Welcome Email
                    added: '2024-03-20 10:00:00'
                    updated_at: '2024-03-20 10:00:00'
          headers: {}
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                        field:
                          type: string
              examples:
                Error:
                  value:
                    error:
                    - message: invalid template id
                      field: template_id
          headers: {}
      security:
      - bearer: []
    patch:
      summary: Update Template
      deprecated: false
      description: This endpoint allows you to update an existing template's name and HTML content using its template ID. Only the first block of HTML content from the array is stored.
      operationId: update-template-by-id
      tags:
      - Template APIs
      parameters:
      - name: template_id
        in: path
        description: ID of the template to update. Must be a positive integer.
        required: true
        example: 123
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - content
              properties:
                name:
                  type: string
                  description: Updated name of the template. Must be unique and non-empty.
                  example: Updated Welcome Email
                content:
                  type: array
                  minItems: 1
                  description: HTML content array. Only the first block will be used.
                  items:
                    type: object
                    required:
                    - type
                    - value
                    properties:
                      type:
                        type: string
                        enum:
                        - html
                        description: Content type. Only "html" is supported.
                        example: html
                      value:
                        type: string
                        maxLength: 10485760
                        description: URL-encoded HTML content. Cannot be empty. Max 10MB.
                        example: <html><body>Welcome to our service!</body></html>
            examples:
              Example:
                value:
                  name: Updated Welcome Email
                  content:
                  - type: html
                    value: <html><body>Welcome to our service!</body></html>
      responses:
        '200':
          description: Template updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  added:
                    type: string
                  updated_at:
                    type: string
              examples:
                Success:
                  value:
                    id: '123'
                    name: Updated Welcome Email
                    added: '2024-03-20 10:00:00'
                    updated_at: '2024-03-20 11:00:00'
        '400':
          description: Bad Request – Returned when input parameters are invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                        field:
                          type: string
              examples:
                Invalid ID:
                  value:
                    error:
                    - message: invalid template id
                      field: template_id
                Duplicate Name:
                  value:
                    error:
                    - message: duplicate template name
                      field: name
      security:
      - bearer: []
    servers:
    - url: https://emailapi.netcorecloud.net/v6
      description: For Non EU region
    - url: https://apieu.netcorecloud.net/v6
      description: For EU region
  /rcs/botinfo:
    parameters: []
    get:
      summary: Fetch Bot Info API
      tags:
      - Template APIs
      security:
      - bearerAuth: []
      description: 'Use this endpoint to retrieve bot metadata without sending a request body.

        Pass all required values as query parameters or headers.'
      parameters:
      - schema:
          type: string
          example: a3f1d5e792bc4e8aa6785c9d12f30b44
        in: header
        name: api_key
        description: Enter your RCS API key for authentication.
        required: true
      - schema:
          type: string
        in: header
        name: Content-Type
        description: Must be set to application/json.
        required: true
      - schema:
          type: string
        in: query
        name: type
        description: 'Enter the bot type you want to filter by. For example: Promotional.'
      - schema:
          type: string
          example: abc123
        in: header
        name: nc_bot_id
        description: "Optional. Enter the unique bot identifier from the RCS Dashboard.  \nIf not provided, the system uses the default bot configured in your panel.\n"
      responses:
        '200':
          description: "**Success Response — Bot details found**\n\n```\n{\n    \"status\": \"success\",\n    \"message\": \"Data fetched successfully\",\n    \"client_id\": <client_id>,\n    \"data\": {\n        \"bot_details\": [\n            {\n                \"botId\": \"<bot_id>\",\n                \"bot_type\": \"Promotional\",\n                \"bot_name\": \"Netcore Cloud promotional\"\n            }\n        ]\n    }\n}\n```\n\n**Success Response — No data found**\n\n```\n{\n  \"status\": \"success\",\n  \"message\": \"No data found\",\n  \"client_id\": <client_id>,\n  \"data\": {\n    \"bots\": []\n  }\n}\n```\n"
        '400':
          description: "**Invalid API Key**\n\n```\n{\n   \"errors\":[\n      {\n         \"message\":\"Authorization Failed, invalid token\",\n         \"field\":\"api_key\"\n      }\n   ]\n}\n```\n\n**Invalid Content Type**\n\n```\n{\n   \"errors\":[\n      {\n         \"message\":\"ContentType not valid\",\n         \"field\":\"ContentType\"\n      }\n   ]\n}\n```\n"
      operationId: getRcsBotinfo
      x-stoplight:
        id: wg9ndju0z58jg
      x-internal: false
      x-operation-id-source: derived
    servers:
    - url: https://soipapi.netcorecloud.com
      description: WhatsApp APIs Server
  /rcs/template/preview:
    parameters: []
    get:
      summary: Template Preview API
      tags:
      - Template APIs
      security:
      - bearerAuth: []
      description: 'Retrieve detailed preview information for a specific RCS template.

        This endpoint returns template content, status, orientation, alignment, and all suggestion details.'
      parameters:
      - schema:
          type: string
          example: a3f1d5e792bc4e8aa6785c9d12f30b44
        in: header
        name: api_key
        description: Enter your API key for authentication.
        required: true
      - schema:
          type: string
          example: application/json
        in: header
        name: Content-Type
        description: Must be set to application/json.
        required: true
      - schema:
          type: integer
          example: 9753
        in: query
        name: template_id
        description: The ID of the template to preview.
        required: true
      - schema:
          type: string
          example: abc123
        in: header
        name: nc_bot_id
        description: 'Optional bot ID. If not provided, the default bot configured on your panel will be used.

          You can locate the nc_bot_id in the General Settings on the CPaaS >> Bot ID.

          '
      responses:
        '200':
          description: "Successfully fetched template preview data.\n\n```\n{\n    \"status\": \"success\",\n    \"message\": \"Data fetched successfully\",\n    \"template_id\": 9753,\n    \"data\": {\n        \"template_name\": \"test_half\",\n        \"template_type\": \"text_message\",\n        \"template_status\": \"auto-approved\",\n        \"template_content\": \"Hello welocme to netcore\",\n        \"orientation\": \"\",\n        \"alignment\": \"\",\n        \"height\": \"\",\n        \"width\": \"\",\n        \"suggestion_details\": [\n            {\n                \"suggestion_type\": \"2\",\n                \"suggestion\": \"{\\\"displayText\\\":\\\"Visit half\\\",\\\"postback\\\":\\\"Visit half\\\",\\\"url\\\":\\\"https://www.netcorecloud.com/\\\",\\\"webview\\\":\\\"Half\\\"}\"\n            },\n            {\n                \"suggestion_type\": \"1\",\n                \"suggestion\": \"{\\\"displayText\\\":\\\"Click here\\\",\\\"postback\\\":\\\"Click here\\\"}\"\n            },\n            {\n                \"suggestion_type\": \"8\",\n                \"suggestion\": \"{\\\"displayText\\\":\\\"Visit Tall\\\",\\\"postback\\\":\\\"Visit Tall\\\",\\\"url\\\":\\\"https://www.netcorecloud.com\\\",\\\"domain\\\":\\\"https://qa.nctrckg.com\\\",\\\"suggestionAttr\\\":\\\"[button_3_url]\\\",\\\"webview\\\":\\\"Tall\\\"}\"\n            },\n            {\n                \"suggestion_type\": \"2\",\n                \"suggestion\": \"{\\\"displayText\\\":\\\"Visit Full\\\",\\\"postback\\\":\\\"Visit Full\\\",\\\"url\\\":\\\"https://www.abcccccc.com/\\\",\\\"webview\\\":\\\"Full\\\"}\"\n            },\n            {\n                \"suggestion_type\": \"2\",\n                \"suggestion\": \"{\\\"displayText\\\":\\\"Visit Default\\\",\\\"postback\\\":\\\"Visit Default\\\",\\\"url\\\":\\\"https://www.netcorecloud.com/\\\"}\"\n            },\n            {\n                \"suggestion_type\": \"4\",\n                \"suggestion\": \"{\\\"displayText\\\":\\\"Get Location\\\",\\\"postback\\\":\\\"Get Location\\\",\\\"latitude\\\":\\\"23.455\\\",\\\"longitude\\\":\\\"54.566\\\",\\\"label\\\":\\\"Netcore\\\"}\"\n            }\n        ],\n        \"created_date\": \"2025-11-07 18:41:08\",\n        \"updated_date\": \"2025-11-07 18:45:00\"\n    }\n}\n```\n"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                    description: Response status
                  message:
                    type: string
                    example: Data fetched successfully
                    description: Response message
                  template_id:
                    type: integer
                    example: 9753
                    description: The ID of the template
                  data:
                    type: object
                    properties:
                      template_name:
                        type: string
                        example: test_half
                        description: Name of the template
                      template_type:
                        type: string
                        example: text_message
                        description: Type of the template (e.g., text_message, carousel, rich_card)
                      template_status:
                        type: string
                        example: auto-approved
                        description: Status of the template (e.g., approved, auto-approved, pending)
                      template_content:
                        type: string
                        example: Hello welocme to netcore
                        description: Content/text of the template
                      orientation:
                        type: string
                        example: ''
                        description: Orientation of the template (vertical/horizontal)
                      alignment:
                        type: string
                        example: ''
                        description: Alignment of the template (left/right/center)
                      height:
                        type: string
                        example: ''
                        description: Height of the template (SHORT/MEDIUM/TALL)
                      width:
                        type: string
                        example: ''
                        description: Width of the template (SMALL/MEDIUM/LARGE)
                      suggestion_details:
                        type: array
                        description: Array of suggestion details for the template
                        items:
                          type: object
                          properties:
                            suggestion_type:
                              type: string
                              example: '2'
                              description: 'Type of suggestion:

                                1 = REPLY

                                2 = OPEN_URL

                                4 = SHOW_LOCATION

                                8 = OPEN_URL with dynamic attributes

                                '
                            suggestion:
                              type: string
                              example: '{"displayText":"Visit half","postback":"Visit half","url":"https://www.netcorecloud.com/","webview":"Half"}'
                              description: 'JSON string containing suggestion details. Structure varies by suggestion_type:

                                - Type 1 (REPLY): {"displayText":"...","postback":"..."}

                                - Type 2 (OPEN_URL): {"displayText":"...","postback":"...","url":"...","webview":"..."}

                                - Type 4 (SHOW_LOCATION): {"displayText":"...","postback":"...","latitude":"...","longitude":"...","label":"..."}

                                - Type 8 (OPEN_URL with dynamic): {"displayText":"...","postback":"...","url":"...","domain":"...","suggestionAttr":"...","webview":"..."}

                                '
                      created_date:
                        type: string
                        format: date-time
                        example: '2025-11-07 18:41:08'
                        description: Template creation date
                      updated_date:
                        type: string
                        format: date-time
                        example: '2025-11-07 18:45:00'
                        description: Template last update date
              examples:
                Success Response:
                  value:
                    status: success
                    message: Data fetched successfully
                    template_id: 9753
                    data:
                      template_name: test_half
                      template_type: text_message
                      template_status: auto-approved
                      template_content: Hello welocme to netcore
                      orientation: ''
                      alignment: ''
                      height: ''
                      width: ''
                      suggestion_details:
                      - suggestion_type: '2'
                        suggestion: '{"displayText":"Visit half","postback":"Visit half","url":"https://www.netcorecloud.com/","webview":"Half"}'
                      - suggestion_type: '1'
                        suggestion: '{"displayText":"Click here","postback":"Click here"}'
                      - suggestion_type: '8'
                        suggestion: '{"displayText":"Visit Tall","postback":"Visit Tall","url":"https://www.netcorecloud.com","domain":"https://qa.nctrckg.com","suggestionAttr":"[button_3_url]","webview":"Tall"}'
                      - suggestion_type: '2'
                        suggestion: '{"displayText":"Visit Full","postback":"Visit Full","url":"https://www.abcccccc.com/","webview":"Full"}'
                      - suggestion_type: '2'
                        suggestion: '{"displayText":"Visit Default","postback":"Visit Default","url":"https://www.netcorecloud.com/"}'
                      - suggestion_type: '4'
                        suggestion: '{"displayText":"Get Location","postback":"Get Location","latitude":"23.455","longitude":"54.566","label":"Netcore"}'
                      created_date: '2025-11-07 18:41:08'
                      updated_date: '2025-11-07 18:45:00'
        '400':
          description: "Returned for invalid authentication, incorrect content type, or missing/invalid template_id.\n\n**Invalid API Key:**\n```\n{\n    \"errors\": [\n        {\n            \"message\": \"Authorization Failed, invalid token\",\n            \"field\": \"api_key\"\n        }\n    ]\n}\n```\n\n**Invalid Content Type:**\n```\n{\n    \"errors\": [\n        {\n            \"message\": \"ContentType not valid\",\n            \"field\": \"ContentType\"\n        }\n    ]\n}\n```\n\n**Missing or Invalid Template ID:**\n```\n{\n    \"errors\": [\n        {\n            \"message\": \"Template ID is required\",\n            \"field\": \"template_id\"\n        }\n    ]\n}\n```\n"
        '404':
          description: "Template not found.\n\n```\n{\n    \"status\": \"error\",\n    \"message\": \"Template not found\",\n    \"template_id\": 9753\n}\n```\n"
      operationId: getRcsTemplatePreview
      x-stoplight:
        id: template_preview_endpoint
      x-internal: false
      x-operation-id-source: derived
    servers:
    - url: https://soipapi.netcorecloud.com
      description: WhatsApp APIs Server
  /template:
    parameters: []
    get:
      summary: Fetch Template API
      tags:
      - Template APIs
      security:
      - bearerAuth: []
      description: Fetch your approved RCS templates. Apply query parameters to refine results. No request body is required.
      parameters:
      - schema:
          type: string
          example: a3f1d5e792bc4e8aa6785c9d12f30b44
        in: header
        name: api_key
        description: Enter your API key for authentication.
        required: true
      - schema:
          type: string
        in: header
        name: Content-Type
        description: Set this to application/json.
        required: true
      - schema:
          type: string
        in: query
        name: status
        description: Filter templates by status (e.g., approved).
      - schema:
          type: string
        in: query
        name: limit
        description: Set the number of templates to return.
      - schema:
          type: string
        in: query
        name: exclude_type
        description: Exclude templates of a specific type (e.g., rich_card).
      - schema:
          type: string
        in: query
        name: template_type
        description: Filter templates by type (e.g., carousel).
      - schema:
          type: string
        in: query
        name: offset
        description: Skip a specific number of records before fetching results.
      - schema:
          type: string
        in: query
        name: name
        description: Search for a template by name.
      - schema:
          type: string
          example: abc123
        in: header
        name: nc_bot_id
        description: Optional bot ID. If not provided, the default bot configured on your panel will be used.
      responses:
        '200':
          description: "Successfully fetched template data.\n\n```\n{\n   \"status\":\"success\",\n   \"message\":\"Data fetched successfully\",\n   \"client_id\":<CLIENT_ID>,\n   \"data\":{\n      \"bot_id\":\"<BOT_ID>\",\n      \"bot_type\":\"Promotional\",\n      \"bot_name\":\"Netcore Cloud promotional\",\n      \"templates\":[\n         {\n            \"template_id\":<TEMPLATE_ID>,\n            \"template_name\":\"<TEMPLATE_NAME>\",\n            \"template_type\":\"carousel\",\n            \"template_status\":\"approved\",\n            \"display_template_type\":\"Rich card carousel\",\n            \"created_at\":\"2024-04-24 17:13:09\",\n            \"modified_at\":\"2024-04-24 17:13:09\"\n         }\n      ],\n      \"total_rows\":1\n   }\n}\n```\n\nNo templates found:\n\n```\n{\n   \"status\":\"success\",\n   \"message\":\"No data found\",\n   \"client_id\":77865,\n   \"data\":{\n      \"templates\":[],\n      \"total_rows\":0\n   }\n}\n```\n"
        '400':
          description: "Returned for invalid authentication or incorrect content type.\n\nInvalid API key:\n```\n{\n   \"errors\":[\n      {\n         \"message\":\"Authorization Failed, invalid token\",\n         \"field\":\"api_key\"\n      }\n   ]\n}\n```\n\nInvalid content type:\n```\n{\n   \"errors\":[\n      {\n         \"message\":\"ContentType not valid\",\n         \"field\":\"ContentType\"\n      }\n   ]\n}\n```\n"
      operationId: getTemplate
      x-stoplight:
        id: 59tk0a7un2i7i
      x-operation-id-source: derived
    servers:
    - url: https://soipapi.netcorecloud.com
      description: WhatsApp APIs Server
  /template/create:
    post:
      summary: Create RCS Carousel Template
      tags:
      - Template APIs
      operationId: postTemplateCreate
      security:
      - bearerAuth: []
      description: Send template creation details in the JSON request body. Use this API to create text templates, single rich cards, or multi-card carousel templates.
      responses:
        '200':
