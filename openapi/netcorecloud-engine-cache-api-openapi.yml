openapi: 3.2.0
info:
  title: Orbit Router Engine — Cache API
  version: 1.0.0
  description: Complete API specification for the Orbit Router email routing platform.
  contact:
    name: Orbit Engineering
  license:
    name: Proprietary
servers:
- url: https://orbitus.netcorecloud.com
  description: Production — Orbit Engine (HTTP Relay)
- url: https://orbitus.netcorecloud.com/apiorbit
  description: Production — Orbit Backend (Config & Management)
security: []
tags:
- name: Engine — Cache
  description: Cache refresh endpoints for immediate config propagation.
paths:
  /v1/cache/refresh/all:
    post:
      operationId: cacheRefreshAll
      tags:
      - Engine — Cache
      summary: Refresh all caches
      description: Clears all caches (rules, routes, auth, distribution) at once.
      security: []
      responses:
        '200':
          $ref: '#/components/responses/CacheRefreshSuccess'
  /v1/cache/refresh/auth:
    post:
      operationId: cacheRefreshAuth
      tags:
      - Engine — Cache
      summary: Refresh auth cache
      description: Clears auth cache (API key, SMTP user).
      security: []
      responses:
        '200':
          $ref: '#/components/responses/CacheRefreshSuccess'
  /v1/cache/refresh/routes:
    post:
      operationId: cacheRefreshRoutes
      tags:
      - Engine — Cache
      summary: Refresh routes cache
      description: Clears route and distribution caches.
      security: []
      responses:
        '200':
          $ref: '#/components/responses/CacheRefreshSuccess'
  /v1/cache/refresh/rules:
    post:
      operationId: cacheRefreshRules
      tags:
      - Engine — Cache
      summary: Refresh rules cache
      description: Clears client rules and global rules caches. Changes take effect immediately.
      security: []
      responses:
        '200':
          $ref: '#/components/responses/CacheRefreshSuccess'
components:
  responses:
    CacheRefreshSuccess:
      description: Cache cleared successfully.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: ok
              cache:
                type: string
                example: rules
              message:
                type: string
                example: rules cache cleared
  securitySchemes:
    BackendJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT token obtained from `POST /auth/login`. Access token lifetime: 15 minutes.

        Claims: `user_id`, `client_id`, `role`, `jti`, `exp`, `iat`.

        '
    EngineApiKeyBearer:
      type: http
      scheme: bearer
      description: 'Engine API key via `Authorization: Bearer <api_key>` (priority 1).'
    EngineApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: Engine API key via `X-API-Key` header (priority 2).
    EngineApiKeyFallback:
      type: apiKey
      in: header
      name: api_key
      description: Engine API key via `api_key` header (priority 3, fallback).
x-readme:
  explorer-enabled: true
  proxy-enabled: true
x-provenance:
  method: searched
  source: https://emaildocs.netcorecloud.com/reference
  note: Verbatim OpenAPI fragments embedded in each ReadMe reference page on emaildocs.netcorecloud.com, merged by path. Not authored by API Evangelist.
  retrieved: '2026-10-13'
