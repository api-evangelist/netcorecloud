  /ip/pool/remove-ips:
    post:
      tags:
      - IP Management API
      summary: Remove IPs from Pool
      description: This allows a parent account to remove specific dedicated IP addresses from an existing pool.
      operationId: removeIPsFromPool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pool_name:
                  type: string
                  example: marketing-pool
                  description: The name of the IP pool from which the IPs should be removed. Must refer to an exisiting pool owned by the parent account.
                ips_to_add:
                  type: array
                  items:
                    type: string
                    format: ipv4
                  minItems: 1
                  maxItems: 100
                  example:
                  - 192.168.1.100
                  description: A list of IP addresses to remove from the pool. At least one IP must be provided. Each IP must already be assigned to the specified pool.
              required:
              - pool_name
              - ips_to_add
            example:
              pool_name: marketing-pool
              ips_to_add:
              - 192.168.1.100
      responses:
