  /ip/unassign:
    post:
      tags:
      - IP Management API
      summary: Unassign IPs from Subaccount
      description: This allows a parent account to remove one or more dedicated IP addresses that were previously assigned to a subaccount. Each request specifies the subaccount, sending domain, and the IPs to be unassigned.
      operationId: unassignIPsFromSubaccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                removals:
                  type: array
                  description: A list of removal objects specifying the IPs to unassign from subaccounts. Minimum 1 and maximum 10 removal objects per request.
                  items:
                    type: object
                    properties:
                      ip_address:
                        type: array
                        description: One or more IP addresses to remove from the subaccount. Must be valid dedicated IPs that are already assigned to the target subaccount. Atleast 1 IP, maximum 100 IPs per removal object.
                        items:
                          type: string
                          format: ipv4
                        minItems: 1
                        maxItems: 100
                        example:
                        - 192.168.1.100
                      account_name:
                        type: string
                        description: The username of the subaccount from which the IPs should be unassigned. The subaccount must exist under the parent account.
                        example: subaccount1
                      sending_domain:
                        type: string
                        description: The sending domain currently linked with the IP assignment. Must be valid and associated with the subaccount.
                        format: hostname
                        example: mail.example.com
                    required:
                    - ip_address
                    - account_name
                    - sending_domain
                  minItems: 1
                  maxItems: 10
              required:
              - removals
            example:
              removals:
              - ip_address:
                - 192.168.1.100
                account_name: subaccount1
                sending_domain: mail.example.com
      responses:
        '200':
          description: IPs unassigned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - success
                    - partial_success
                    - error
                    example: success
                  message:
                    type: string
                    example: All IPs removed successfully
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        account_name:
                          type: string
                          example: subaccount1
                        ip:
                          type: string
                          example: 192.168.1.100
                        sending_domain:
                          type: string
                          example: mail.example.com
                        status:
                          type: string
                          enum:
                          - success
                          - error
                          example: success
                        message:
                          type: string
                          example: IP unassigned successfully
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
