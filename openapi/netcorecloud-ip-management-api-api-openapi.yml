  /ip/request:
    post:
      tags:
      - IP Management API
      summary: Request New Dedicated IP Addresses
      description: This allows a parent account to request additional dedicated IPs for email sending. The request specifies the number of IPs required, the estimated daily sending volume, the region, and an optional description.
      operationId: requestIP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requested_ips:
                  type: integer
                  minimum: 1
                  maximum: 100
                  description: The number of dedicated IP addresses being requested. Minimum 1, maximum 100 per request.
                  example: 5
                daily_estimated_volume:
                  type: integer
                  minimum: 1
                  description: The estimated daily email volume (number of emails per day) that the requested IPs will be used for.
                  example: 10000
                region:
                  type: string
                  enum:
                  - US
                  - EU
                  - IND
                  description: The geographic region where the IPs should be provisioned. Supported values are US, EU, and IND.
                  example: US
                description:
                  type: string
                  maxLength: 255
                  description: A short description of the intended IP usage. Maximum length 255 characters and alphanumeric text only.
                  example: Additional IPs for marketing campaigns
                enableWarmup:
                  type: boolean
                  description: Indicates whether to enable the automated IP warm-up process. Values are true (enable warmup) or false (disable warmup).When enabled, the warmup logic assigns the appropriate plan based on engagement, bounce behavior, and unsubscribes. The delivery engine increases send volumes gradually using ISP feedback and performance signals to reduce throttling and spam-filtering risk. Netcore manages the full warmup process. Approved volume is sent through the assigned dedicated IP pool, and any excess volume is routed through the Netcore or client shared pool.
                  example: true
              required:
              - requested_ips
              - daily_estimated_volume
            example:
              requested_ips: 5
              daily_estimated_volume: 10000
              region: US
              description: Additional IPs for marketing campaigns
              enableWarmup: true
      responses:
        '200':
          description: IP request submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: Success
                  request_id:
                    type: string
                    description: Unique request identifier
                    example: IP-REQ-2024-001-ABC123
                  message:
                    type: string
                    example: IP request submitted successfully
        '400':
          description: Validation error or business logic error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          description: Error message
                          example: Field validation failed
                        field:
                          type: string
                          description: Field name where error occurred
                          example: requested_ips
              examples:
                validation_error:
                  summary: Validation Error
                  value:
                    error:
                      message: requested_ips must be greater than 0
                      field: requested_ips
                business_logic_error:
                  summary: Business Logic Error
                  value:
                    error:
                      message: 'Daily request limit exceeded. You have already made 5 requests today. Limit: 5 requests per day.'
                      field: null
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          description: Error message
                        field:
                          type: string
                          description: Field name where error occurred
        '403':
