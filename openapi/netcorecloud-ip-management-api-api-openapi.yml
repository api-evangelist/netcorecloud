          description: IPs removed from pool successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  pool_name:
                    type: string
                    example: marketing-pool
                  region:
                    type: string
                    example: US
                  assigned_ips:
                    type: array
                    items:
                      type: string
                    example:
                    - 192.168.1.100
