openapi: 3.2.0
info:
  title: Orbit Router Clients API
  version: 1.0.0
  description: Complete API specification for the Orbit Router email routing platform.
  contact:
    name: Orbit Engineering
  license:
    name: Proprietary
servers:
- url: https://orbitus.netcorecloud.com
  description: Production — Orbit Engine (HTTP Relay)
- url: https://orbitus.netcorecloud.com/apiorbit
  description: Production — Orbit Backend (Config & Management)
security: []
tags:
- name: Clients
paths:
  /clients:
    post:
      operationId: createSubClient
      tags:
      - Clients
      summary: Create a sub-client
      security:
      - BackendJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - clientname
              properties:
                clientname:
                  type: string
                status:
                  type: string
                  enum:
                  - active
                  - inactive
                  default: active
      responses:
        '201':
          description: Sub-client created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSummary'
    get:
      operationId: listSubClients
      tags:
      - Clients
      summary: List sub-clients
      description: Lists sub-clients of the current client.
      security:
      - BackendJWT: []
      responses:
        '200':
          description: List of sub-clients.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientSummary'
  /clients/switchable:
    get:
      operationId: listSwitchableClients
      tags:
      - Clients
      summary: List clients the user can switch to
      security:
      - BackendJWT: []
      responses:
        '200':
          description: Switchable client list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientSummary'
  /clients/{id}:
    parameters:
    - $ref: '#/components/parameters/ResourceId'
    put:
      operationId: updateClient
      tags:
      - Clients
      summary: Update client status
      description: Admin only.
      security:
      - BackendJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - active
                  - inactive
      responses:
        '200':
          description: Client updated.
components:
  schemas:
    ClientSummary:
      type: object
      properties:
        client_id:
          type: integer
        clientname:
          type: string
        status:
          type: string
          enum:
          - active
          - inactive
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Resource ID.
  securitySchemes:
    BackendJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT token obtained from `POST /auth/login`. Access token lifetime: 15 minutes.

        Claims: `user_id`, `client_id`, `role`, `jti`, `exp`, `iat`.

        '
    EngineApiKeyBearer:
      type: http
      scheme: bearer
      description: 'Engine API key via `Authorization: Bearer <api_key>` (priority 1).'
    EngineApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: Engine API key via `X-API-Key` header (priority 2).
    EngineApiKeyFallback:
      type: apiKey
      in: header
      name: api_key
      description: Engine API key via `api_key` header (priority 3, fallback).
x-readme:
  explorer-enabled: true
  proxy-enabled: true
x-provenance:
  method: searched
  source: https://emaildocs.netcorecloud.com/reference
  note: Verbatim OpenAPI fragments embedded in each ReadMe reference page on emaildocs.netcorecloud.com, merged by path. Not authored by API Evangelist.
  retrieved: '2026-10-13'
