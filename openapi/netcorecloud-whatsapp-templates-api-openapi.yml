  /v3/metainfo/template/delete:
    delete:
      summary: Delete Template API
      tags:
      - WhatsApp Templates
      operationId: deleteTemplate
      description: Delete a WhatsApp template. This process helps maintain an organized template library by removing outdated templates and preventing clutter.
      parameters:
      - $ref: '#/paths/~1v3~1metainfo~1template~1list/get/parameters/0'
      - name: name
        in: query
        required: true
        description: Name of the template to delete.
        schema:
          type: string
      requestBody:
        required: true
        description: Template deletion data including name and language.
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - language
              properties:
                name:
                  type: string
                  description: Template name to delete
                language:
                  type: string
                  description: Template language code
      responses:
        '200':
          description: Successfully deleted template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteTemplateSuccessResponse'
        '400':
          $ref: '#/paths/~1v3~1metainfo~1template~1list/get/responses/400'
        '401':
          $ref: '#/paths/~1v3~1metainfo~1template~1list/get/responses/401'
        '500':
          $ref: '#/paths/~1v3~1metainfo~1template~1list/get/responses/500'
  /v3/metainfo/template/edit_category:
    post:
      summary: Edit Category API
      tags:
      - WhatsApp Templates
      operationId: editCategory
      description: Edit the category of a given template.
      parameters:
      - $ref: '#/paths/~1v3~1metainfo~1template~1list/get/parameters/0'
      - name: template_id
        in: query
        required: false
        description: Unique identifier of the template
        schema:
          type: integer
          example: 12345
      - name: template_name
        in: query
        required: false
        description: Name of the template
        schema:
          type: string
          example: template_name
      requestBody:
        required: true
        description: Request body for editing template category
        content:
          application/json:
            schema:
              type: object
              required:
              - new_category
              properties:
