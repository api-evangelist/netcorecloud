openapi: 3.2.0
info:
  title: WhatsApp Templates API
  version: '1.0'
  description: Comprehensive collection of WhatsApp APIs that allow users to interact with WhatsApp Flows, Templates, Message Sending, Conversations, Consent Management, Webhooks, Payments, and Media associated with a specific WABA (WhatsApp Business Account).
  license:
    name: Proprietary
    identifier: proprietary
servers:
- url: https://cpaaswa.netcorecloud.net/api
  description: WhatsApp APIs Server
- url: https://cpaaswa.netcorecloud.net
  description: WhatsApp Root Server
security:
- bearerAuth: []
tags:
- name: WhatsApp Templates
paths:
  /v3/metainfo/template/list:
    get:
      summary: Fetch Template List API
      tags:
      - WhatsApp Templates
      operationId: fetchTemplateList
      description: Retrieve a list of WhatsApp templates with support for filtering, sorting, and pagination. This API allows you to filter templates by status, name, language, and type to efficiently manage your template library.
      parameters:
      - name: Content-Type
        in: header
        required: true
        description: Must be set to 'application/json' for JSON requests.
        schema:
          type: string
          example: application/json
      - name: status
        in: query
        required: false
        description: Filter templates by their approval status. Example - approved, rejected.
        schema:
          type: string
          enum:
          - approved
          - rejected
          - pending
      - name: template_name
        in: query
        required: false
        description: Filter templates using a partial or full match of the template name.
        schema:
          type: string
      - name: language
        in: query
        required: false
        description: Filter templates by language. Example - English, Hindi.
        schema:
          type: string
      - name: template_type
        in: query
        required: false
        description: Filter templates by type. Comma-separated values like 1,2.
        schema:
          type: string
      - name: offset
        in: query
        required: false
        description: Number of records to skip for pagination.
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        required: false
        description: Maximum number of records to return.
        schema:
          type: integer
          default: 10
      responses:
        '200':
          description: Successfully retrieved template list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateListSuccessResponse'
        '400':
          description: Bad Request - Template specific error
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    example: failure
                  message:
                    type: string
                    description: Error description
                  error_code:
                    type: string
                    description: Specific error code
                  details:
                    type: object
                    description: Additional error details
              example:
                status: failure
                message: Invalid template parameters
        '401':
          description: Unauthorized - Invalid token
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v3~1metainfo~1template~1list/get/responses/400/content/application~1json/schema'
              example:
                status: failure
                message: Invalid or expired authentication token
        '500':
          description: Internal Server Error - Template API error
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v3~1metainfo~1template~1list/get/responses/400/content/application~1json/schema'
              example:
                status: failure
                message: Internal server error occurred
