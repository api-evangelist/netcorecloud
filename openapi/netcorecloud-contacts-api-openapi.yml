  /contact/upsert:
    post:
      summary: Upsert Contacts [Async]
      deprecated: false
      description: 'The **Upsert Contact API** enables clients to create or update (“upsert”) one or more contacts within a single request. This endpoint supports both **identified** and **anonymous** contact types, providing flexibility for various data ingestion scenarios.


        Each contact can include core identifiers — **`email`**, **`mobile`**, and **`identity`** — along with system or custom **attributes** and optional **audience assignments**. The API performs strict validation, ensures attribute integrity, and automatically determines whether to insert a new record or update an existing one based on the provided identifiers.'
      tags:
      - Contacts
      parameters:
      - name: api-key
        in: header
        description: API key for authentication. You must have unique & valid api-key
        required: true
        example: 6a8f3c1b9d2e4f7a123b456c7890abcd
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Specifies the request content type. Must be application/json.
        required: true
        example: application/json
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    contact_type:
                      type: string
                      description: Specify the type of contact to be created. Choose between `"identified"` or `"anonymous"`.
                      example: identified
                    contacts:
                      type: array
                      items:
                        type: object
                        properties:
                          identity:
                            type: string
                            description: "- **Required** when `contact_type = \"identified\"` (identity serves as the primary key and can be `email`, `mobile`, or `custom parameter`).  \n- **Not required** when `contact_type = \"anonymous\"`.  \n\n**Validation:**  \nIdentity must match the format of the selected primary key:\n\n#### If identity = email  \n- **Minimum length:** 1 character  \n- **Maximum length:** 255 characters  \n- **Pattern:** `^([a-z0-9_Xx])([a-z0-9+-Xx]+)(.[a-z0-9+-Xx]+)@([a-z0-9-]+.)+[a-z]{2,25}$`\n\n#### If identity = mobile  \n- **Minimum length:** 7 character  \n- **Maximum length:** 15 characters  \n- **Pattern:** `^[0-9]{7,15}$`"
                          email:
                            type: string
                            description: "- **Required** when `contact_type = \"identified\"` **and the primary key is `email`**.  \n - **Optional** when `contact_type = \"identified\"` **and the primary key is `mobile` or `custom parameter`**.\n- **Not required** when `contact_type = \"anonymous\"` **and the primary key is `email`** (anonymous contacts cannot use `email` as an identifier; only mobile is allowed).  "
                            minLength: 1
                            maxLength: 255
                            pattern: ^([a-z0-9_Xx])([a-z0-9+-Xx]+)(.[a-z0-9+-Xx]+)@([a-z0-9-]+.)+[a-z]{2,25}$
                          mobile:
                            type: string
                            description: "- **Required** when `contact_type = \"identified\"` **and the primary key is `mobile`**.  \n- **Optional** when `contact_type = \"identified\"` **and the primary key is `email` or `custom parameter`**.  \n- **Not required** when `contact_type = \"anonymous\"` **and the primary key is `mobile`** (anonymous contacts must use mobile as the identifier).  "
                            minLength: 7
                            maxLength: 15
                            pattern: ^[0-9]{5,17}$
                          attributes:
                            type: object
                            properties:
                              '{{Atribute_Name}}':
                                type: string
                                pattern: '[^a-zA-Z0-9_]'
                            description: "- Specify attributes to be tagged to the contact as key–value pairs.  \n- Keys represent attribute names, values represent attribute values (e.g., `\"AGE\": 30`).  \n- All **system attributes** and **custom attributes** are allowed.  \n- The request will be **rejected** if:  \n  - the attribute does not exist in the system, or  \n  - the attribute is a **derived attribute**."
                          audience_details:
                            type: array
                            items:
                              type: object
                              properties:
                                audience_id:
                                  type: array
                                  items:
                                    type: integer
                                  description: "- **audience_id** – required when `audience_name` is not provided.  \n  - **Minimum length:** 1  \n  - **Maximum length:** 2,147,483,647"
                                audience_name:
                                  type: array
                                  items:
                                    type: string
                                  description: "- **audience_name** – required when `audience_id` is not provided.  \n  - **Minimum length:** 1  \n  - **Maximum length:** 255  \n  - **Pattern:** `^[a-zA-Z0-9 _&-]+$`"
                                audience_type:
                                  type: string
                                  description: "- **audience_type** (`string`) – allowed values: `list`, `ccg`.  \n  - For `contact_type = \"anonymous\"`, only `list` is allowed."
                            description: Used to assign audience groups to a specific contact. Each contact can have its own audience mapping.
                    audience_details:
                      type: array
                      items:
                        type: object
                        properties:
                          audience_id:
                            type: array
                            items:
                              type: integer
                              minimum: 65
                              maximum: 677
                              description: 'minimum length: 1

                                maximum length: 2147483647'
                            description: "- **audience_id** – required when `audience_name` is not provided.  \n  - **Minimum length:** 1  \n  - **Maximum length:** 2,147,483,647"
                          audience_name:
                            type: array
                            items:
                              type: string
                              description: 'minimum length: 1

                                maximum length: 255

                                regex: ^[a-zA-Z0-9 _&-]+$'
                            description: "- **audience_name** – required when `audience_id` is not provided.  \n  - **Minimum length:** 1  \n  - **Maximum length:** 255  \n  - **Pattern:** `^[a-zA-Z0-9 _&-]+$`"
                          audience_type:
                            type: string
                            description: "- **audience_type** (`string`) – allowed values: `list`, `ccg`.  \n  - For `contact_type = \"anonymous\"`, only `list` is allowed."
                      description: Used to assign audience groups to all contacts in the request. Audience mappings defined here apply globally to every contact.
                  required:
                  - contact_type
                  - contacts
              required:
              - data
            example:
              data:
                contact_type: identified
                contacts:
                - identity: john.doe
                  email: johndoe@example.com
                  mobile: '9999999999'
                  attributes:
                    STATE: Maharastra
