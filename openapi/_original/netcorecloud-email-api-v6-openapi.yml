              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                        stats:
                          type: array
                          items:
                            type: object
                            properties:
                              metrics:
                                type: object
                                properties:
                                  bounce:
                                    type: number
                                  click:
                                    type: number
                                  dropped:
                                    type: number
                                  invalid:
                                    type: number
                                  open:
                                    type: number
                                  sent:
                                    type: number
                                  spam:
                                    type: number
                                  unique_click:
                                    type: number
                                  unique_open:
                                    type: number
                                  unsub:
                                    type: number
                                  processed:
                                    type: number
                      examples:
                      - date: string
                        stats:
                        - metrics:
                            bounce: 0
                            click: 0
                            dropped: 0
                            invalid: 0
                            open: 0
                            sent: 0
                            spam: 0
                            unique_click: 0
                            unique_open: 0
                            unsub: 0
                            processed: 0
                      x-examples:
