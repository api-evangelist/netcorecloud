  /stats:
    get:
      summary: Fetch Summary Stats
      deprecated: false
      description: 'This API tracks key events—such as opens, clicks, and unsubscribes—
        and generates performance statistics, updated hourly based on your profile’s
        timezone.

        You can view this data in your Email API dashboard or retrieve it programmatically
        via this API.

