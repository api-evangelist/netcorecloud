          API key.  Allows performing actions for a specific subaccount by providing
          its username.

          '
        required: false
        schema:
          type: string
          example: subaccount_username
      - name: start_date
        in: query
        description: Start date in `YYYY-MM-DD` format (required).
        required: true
        schema:
          type: string
          format: date
          example: '2024-03-01'
      - name: end_date
        in: query
        description: Optional end date in `YYYY-MM-DD` format.
        required: false
        schema:
          type: string
          format: date
          example: '2024-03-31'
      - name: event_start_date
        in: query
        description: Start date and time in `YYYY-MM-DD HH:mm:ss` format (required).
        required: true
        schema:
          type: string
          format: date-time
          example: '2024-03-01 00:00:00'
      - name: event_end_date
        in: query
        description: Optional end date and time in `YYYY-MM-DD HH:mm:ss` format.
        required: false
        schema:
          type: string
          format: date-time
          example: '2024-03-31 23:59:59'
      - name: events
        in: query
        description: 'Optional list of event types to filter logs by.

          '
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - processed
            - sent
            - open
            - click
            - unsubscribe
            - bounce
            - softbounce
            - spam
            - invalid
            - dropped
            - hardbounce
            - scheduled
            - cancelled
      - name: email
        in: query
        description: Filter by recipient email address.
        required: false
        schema:
          type: string
      - name: subject
        in: query
        description: Filter by email subject.
        required: false
        schema:
          type: string
      - name: custom_args
        in: query
        description: Filter by custom arguments passed in the email payload.
        required: false
        schema:
          type: string
      - name: tags
        in: query
        description: Filter by tags.
        required: false
        schema:
          type: string
      - name: fromaddress
        in: query
        description: Filter by sender's email address.
        required: false
        schema:
          type: string
      - name: fromdomain
        in: query
        description: Filter by sender's domain.
        required: false
        schema:
          type: string
      - name: recipient_domain
        in: query
        description: Filter by recipient's domain.
        required: false
        schema:
          type: string
      - name: message_id
        in: query
        description: Filter logs based on message_id
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: 'Number of records to return. Maximum: 1000.'
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 50
          example: 100
      - name: sort
        in: query
        description: Sort order for the logs based on sent time. Use `asc` or `desc`.
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      - name: scrollid
        in: query
        description: Scroll ID for fetching the next page of results.
        required: false
        schema:
          type: string
          example: DXF1ZXJ5QW5kRmV0Y2gBAAAAAACXzVwWTXZBaGJGOE5UZW1vWGxabjhfM0JnQQ==
      responses:
        '200':
          description: Logs fetched successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  scrollId:
                    type: string
              example:
                data:
                - trid: 12345
                  rcptEmail: recipient@example.com
                  fromaddress: sender@example.com
                  requestedTime: '2024-03-20T10:00:00Z'
                  deliveryTime: '2024-03-20T10:00:05Z'
                  modifiedTime: '2024-03-20T10:00:10Z'
                  status: delivered
                  size: 1024
                  remarks: Success
                  subject: Test Email
                  xapiheader: custom_value
                  tags:
                  - tag1
                  - tag2
                  opens:
                  - time: '2024-03-20T10:01:00Z'
                    ip: 192.168.1.1
                    browser: Chrome
                    os: Windows
                    device: Desktop
                  clicks:
                  - time: '2024-03-20T10:02:00Z'
                    link: https://example.com
                    ip: 192.168.1.1
                    browser: Chrome
                    os: Windows
                    device: Desktop
                scrollId: DXF1ZXJ5QW5kRmV0Y2gBAAAAAACXzVwWTXZBaGJGOE5UZW1vWGxabjhfM0JnQQ==
        '400':
          description: Bad Request – Invalid date ranges or malformed parameters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: event end date must be within 31 days of the event start date
      security:
      - bearer: []
