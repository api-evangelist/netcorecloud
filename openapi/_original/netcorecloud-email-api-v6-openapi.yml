                        account_name:
                          type: string
                          example: subaccount1
                        ip:
                          type: string
                          example: 192.168.1.100
                        sending_domain:
                          type: string
                          example: mail.example.com
                        status:
                          type: string
                          enum:
                          - success
                          - error
                          example: success
                        message:
                          type: string
                          example: IP unassigned successfully
