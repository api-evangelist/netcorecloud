# x-archived-from: netcorecloud-email-api-v6-openapi.yml
# x-archived-on: 2026-10-13
openapi: 3.1.0
info:
  title: Email API V6
  description: ''
  version: 1.0.0
servers:
- url: https://emailapi.netcorecloud.net/v6
  description: For Non EU region
- url: https://apieu.netcorecloud.net/v6
  description: For EU region
tags:
- name: Domain APIs
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security: []
paths:
  /domains:
    post:
      summary: Add Domain
      description: Adds a new domain to your account and configures optional envelope
        and inbound settings.
      operationId: add-domain
      tags:
      - Domain APIs
      parameters:
      - name: on-behalf-of
        in: header
        required: false
        description: Use this header when making requests on behalf of a subaccount.
          Required only when using a master account's API key.
        schema:
          type: string
          example: subaccount_username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - domain
              - envelopeName
              properties:
                domain:
                  type: string
                  description: The domain name you want to add
                envelopeName:
                  type: string
                  description: The domain name you want to add
                inboundName:
                  type: string
                  description: The inbound name you want to configure
      responses:
        '200':
          description: Domain added successfully with DNS validation details.
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                error: Domain already added
      security:
      - bearer: []
    get:
      summary: Get all domains
      description: Retrieves configuration and status details for a specified domain,
        including its DNS setup, tracking settings, and verification status.
      operationId: get-domain
      tags:
      - Domain APIs
      parameters:
      - name: domain_name
        in: query
        required: true
        description: Specifies the domain name.
        schema:
          type: string
      - name: on-behalf-of
        in: header
        required: false
        description: Use this header when making requests on behalf of a subaccount.
          Required only when using a master account's API key.
        schema:
          type: string
          example: subaccount_username
      responses:
        '200':
          description: Domain metadata returned.
        '400':
          description: Invalid domain
          content:
            application/json:
              example:
                error: Invalid domain given, domain not mapped with requested client
      security:
      - bearer: []
  /suppressions/global/domain:
    post:
      summary: Add Domains to Suppression List
      deprecated: false
      description: 'Adds one or more domains to the suppression list. Once added,
        any email addresses belonging to these domains will be blocked from receiving
        further communications from your account. This is typically used to suppress
        domains that bounce frequently, are spam traps, or belong to users who have
        requested to never receive emails from your brand.

        For example, Suppressing **example.com** will block emails to user@example.com.

        The system automatically removes the `www.` prefix if present.

        '
      operationId: add-domains-to-suppression
      tags:
      - Suppression APIs
      parameters:
      - name: on-behalf-of
        in: header
        description: Use this header when making requests on behalf of a subaccount.
          Required only when using a master account's API key.
        required: false
        schema:
          type: string
          example: subaccount_username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - domains
              properties:
                domains:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  description: 'List of domains to suppress. Must be valid domain
                    strings (e.g., example.com). Limit 1 to 1000. The system strips
                    `www.` prefix automatically.

                    '
                  items:
                    type: string
                    format: hostname
                    example: example.com
            examples:
              Valid Request:
                summary: Add 2 domains to suppression list
                value:
                  domains:
                  - example.com
                  - test.com
      responses:
        '201':
          description: Domains successfully added to suppression list.
          content:
            application/json:
              schema:
                type: object
                required:
                - domains
                properties:
                  domains:
                    type: array
                    minItems: 1
                    maxItems: 1000
                    items:
                      type: string
                      format: hostname
                      example: example.com
              examples:
                Success:
                  summary: Domains added
                  value:
                    domains:
                    - example.com
                    - test.com
          headers: {}
        '400':
          description: Invalid request – typically due to missing or malformed domain
            list.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    example: Domain list should be in range of 1 to 1000
              examples:
                Out of Range:
                  summary: More than allowed domains
                  value:
                    error: Domain list should be in range of 1 to 1000
      security:
      - bearer: []
    get:
      summary: Retrieve Domain(s) in the Suppression List
      deprecated: false
      description: This API retrieves a list of domain(s) currently added to the suppression
        list for your account. Suppressed domains are automatically excluded from
        email delivery to prevent sending to recipients from restricted or blocked
        domains. The time period can be defined by using the start_time and end_time
        paramater.
      operationId: get-suppression-domain
      tags:
      - Suppression APIs
      parameters:
      - name: start_time
        in: query
        description: Refers start of the time range in unix timestamp when an unsubscribe
          email was created (inclusive).
        required: false
        schema:
          type: string
          format: date
          example: '2023-01-01'
      - name: end_time
        in: query
        description: Refers end of the time range in unix timestamp when an unsubscribe
          email was created (inclusive).
        required: false
        schema:
          type: string
          format: date
          example: '2023-02-06'
      - name: offset
        in: query
        description: The point in the list of results to begin displaying global suppressions.
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: limit
        in: query
        description: The number of results to display on each page.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1000
      - name: on-behalf-of
        in: header
        description: Use this header when making requests on behalf of a subaccount.
          Required only when using a master account's API key.
        required: false
        schema:
          type: string
          example: subaccount_username
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/paths/~1suppressions~1global~1domain~1%7Bdomain%7D/get/responses/200/content/application~1json/schema'
              example:
              - domain: example.com
                created: '2024-03-20 10:00:00'
                modified: '2024-03-20 10:00:00'
                status: 5
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
              example:
                error: Start Date should be in required format (yyyy-mm-dd)
          headers: {}
      security:
      - bearer: []
    delete:
      summary: Remove Domains from Suppression List
      deprecated: false
      description: 'Removes one or more domains from your suppression list. Once removed,
        email addresses under these domains will be whitelisted and can start receiving
        communication again.

        This is useful when a domain was mistakenly suppressed or is now eligible
        to receive emails.

        For example  Removing **example.com** allows emails to user@example.com again.

        '
      operationId: remove-domains-from-suppression
      tags:
      - Suppression APIs
      parameters:
      - name: on-behalf-of
        in: header
        description: 'Use this header when making requests on behalf of a subaccount.
          Required only when using a master account''s API key.

          '
        required: false
        example: subaccount_username
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - domains
              properties:
                domains:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  description: 'List of domains to be removed from the suppression
                    list. Each domain must be valid (e.g., example.com). Limit 1 to
                    1000.

                    '
                  items:
                    type: string
                    format: hostname
                    example: example.com
            examples:
              Valid Request:
                summary: Remove 2 domains from suppression list
                value:
                  domains:
                  - example.com
                  - test.com
      responses:
        '204':
          description: Domains successfully removed from suppression list. No content
            returned.
          headers: {}
        '400':
          description: Bad Request – Invalid or missing domain list.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    example: Domain list should be in range of 1 to 1000
              examples:
                Out of Range:
                  summary: Too many or no domains
                  value:
                    error: Domain list should be in range of 1 to 1000
      security:
      - bearer: []
  /suppressions/global/email:
    post:
      summary: Add Email(s) to Suppression List
      deprecated: false
      description: 'This endpoint allows you to suppress one or more email addresses
        and block any future delivery attempts to those addresses from your account.
        Suppressing email addresses is useful for managing bounces, spam complaints,
        or opt-out requests to ensure compliant and clean email delivery. For example:
        Suppressing `youremailid@gmail.com` will block all future delivery attempts
        to that address.'
      operationId: add-suppression-email
      tags:
      - Suppression APIs
      parameters:
      - name: on-behalf-of
        in: header
        description: '*(Optional)* Use this header when making API calls on behalf
          of a subaccount. Required only if you’re using a master account’s API key.

          '
        required: false
        example: subaccount_username
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - recipient_emails
              properties:
                recipient_emails:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  description: 'List of email addresses to be suppressed. Must be
                    in valid email format (e.g., user@example.com).  Limit: 1–1000
                    entries.

                    '
                  items:
                    type: string
                    format: email
                    example: user@example.com
            examples:
              Valid Request:
                summary: Suppress multiple email addresses
                value:
                  recipient_emails:
                  - user@example.com
                  - test@example.com
      responses:
        '201':
          description: Email(s) successfully added to suppression list.
          content:
            application/json:
              schema:
                type: object
                required:
                - recipient_emails
                properties:
                  recipient_emails:
                    type: array
                    minItems: 1
                    maxItems: 1000
                    items:
                      type: string
                      format: email
                      example: user@example.com
              examples:
                Success:
                  summary: Emails added to suppression list
                  value:
                    recipient_emails:
                    - user@example.com
                    - test@example.com
          headers: {}
        '400':
          description: Bad Request – Invalid or missing email list.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    example: Email list should be between 1 to 1000
              examples:
                Invalid Input:
                  summary: Empty or excessive email list
                  value:
                    error: Email list should be between 1 to 1000
          headers: {}
      security:
      - bearer: []
    delete:
      summary: Remove Email(s) from Suppression List
      deprecated: false
      description: 'This endpoint allows you to remove one or more email addresses
        from your suppression list.  Once removed, these addresses will be eligible
        to receive emails again from your account.

        This operation is useful if an address was suppressed due to a temporary issue
        (like a bounce)  or has since opted back in to receive communications.

        Note: While you can remove suppressed addresses, it''s good practice to continue
        suppressing  recipients who have explicitly opted out or shown no engagement.

        '
      operationId: delete-suppression-email
      tags:
      - Suppression APIs
      parameters:
      - name: on-behalf-of
        in: header
        description: Optional header used when making API calls with a master account’s
          API key. It allows actions to be performed on behalf of a specific subaccount
          by specifying the subaccount’s username.
        required: false
        example: subaccount_username
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: array
                  description: 'A list of email addresses to be removed from the suppression
                    list. The list must contain between 1 and 1000 valid email addresses.

                    '
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: string
                    format: email
                    example: test@example.com
            examples:
              Valid Request:
                summary: Remove multiple emails
                value:
                  email:
                  - user@example.com
                  - test@example.com
      responses:
        '204':
          description: Email(s) successfully removed from suppression list. No response
            body is returned.
          headers: {}
        '400':
          description: Bad Request – Invalid email list (e.g., none provided or exceeds
            limit).
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
              examples:
                Invalid List:
                  summary: Too few or too many emails
                  value:
                    error: Email list should be between 1 to 1000
      security:
      - bearer: []
    get:
      summary: List Suppressed Emails
      deprecated: false
      description: Retrieves a paginated list of domains currently added to the suppression
        list. You can apply optional filters such as start and end date, and use pagination
        parameters to control result size and navigation. This is useful for auditing
        or managing domains that are blocked from receiving emails.
      operationId: get-suppressed-emails
      tags:
      - Suppression APIs
      parameters:
      - name: start_time
        in: query
        description: Optional filter to return domains suppressed on or after this
          date. Format is YYYY-MM-DD. It is applicable for modified date only.
        required: false
        schema:
          type: string
          format: date
          example: '2022-02-10'
      - name: end_time
        in: query
        description: Optional filter to return domains suppressed on or before this
          date. Must be equal to or later than `start_time`. Format is YYYY-MM-DD.
          It is applicable for modified date only.
        required: false
        schema:
          type: string
          format: date
          example: '2022-03-10'
      - name: offset
        in: query
        description: 'Number of records to skip for pagination. Minimum: 0. Default:
          0.'
        required: false
        schema:
          type: integer
          minimum: 0
          example: 5
      - name: limit
        in: query
        description: 'Number of records to return in the response. Range: 1–1000.
          Default: 1000.'
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          example: 10
      - name: on-behalf-of
        in: header
        description: '*(Optional)* Use this header when making API calls on behalf
          of a subaccount. Required only if you’re using a master account’s API key.'
        required: false
        schema:
          type: string
          example: subaccount_username
      responses:
        '200':
          description: List of suppressed domains retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    email:
                      type: string
                    created:
                      type: string
                      format: date-time
                    modified:
                      type: string
                      format: date-time
                    status:
                      type: integer
                  required:
                  - email
                  - created
                  - modified
                  - status
              examples:
                Success:
                  summary: Example response
                  value:
                  - email: user@example.com
                    created: '2024-03-20 10:00:00'
                    modified: '2024-03-20 10:00:00'
                    status: 5
        '400':
          description: Bad Request – Likely due to invalid query parameters (e.g.,
            limit out of range).
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    example: Limit value should be between 1 to 1000
              examples:
                Invalid Limit:
                  summary: Limit out of range
                  value:
                    error: Limit value should be between 1 to 1000
      security:
      - bearer: []
  /ip/pool/assign-ips:
    post:
      tags:
      - IP Management API
      summary: Assign IPs to Pool
      description: This allows a parent account to add one or more dedicated IP addresses
        to an existing IP pool. This is useful for organizing IPs into logical groups
        for different sending stream.
      operationId: assignIPsToPool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pool_name:
                  type: string
                  example: marketing-pool
                  description: The name of the IP pool to which the IPs should be
                    added.
                ips_to_add:
                  type: array
                  description: A list of IP addresses to be assigned to the pool.At
                    least one IP must be provided. maximum 100 IPs per request. All
                    IPs must belong to the same region. Each IP must be valid, owned
                    by the parent account, and not already assigned to the pool.
                  items:
                    type: string
                    format: ipv4
                  minItems: 1
                  maxItems: 100
                  example:
                  - 192.168.1.100
                  - 192.168.1.101
              required:
              - pool_name
              - ips_to_add
            example:
              pool_name: marketing-pool
              ips_to_add:
              - 192.168.1.100
              - 192.168.1.101
      responses:
        '200':
          description: IPs assigned to pool successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  pool_name:
                    type: string
                    example: marketing-pool
                  region:
                    type: string
                    example: US
                  assigned_ips:
                    type: array
                    items:
                      type: string
                    example:
                    - 192.168.1.100
                    - 192.168.1.101
                  updated_on:
                    type: string
                    format: date-time
                    example: '2024-01-15T10:30:00Z'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          description: Error message
                        field:
                          type: string
                          description: Field name where error occurred
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          description: Error message
                        field:
                          type: string
                          description: Field name where error occurred
        '403':
          description: Pool not owned or IP not owned
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          description: Error message
                        field:
                          type: string
                          description: Field name where error occurred
      security:
      - bearer: []
  /ip/assign:
    post:
      tags:
      - IP Management API
      summary: Assign IPs to subaccount
      description: This allows a parent account to allocate one or more dedicated
        IP addresses to a subaccount by linking them with a specified sending domain.
        This ensures that the subaccount can send emails using the assigned IPs. The
        request must include the subaccount name, sending domain, and IP addresses,
        with all IPs belonging to the same region and owned by the parent account.
      operationId: assignIPsToSubaccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assignments:
                  type: array
                  description: A list of assignment objects. Each obejct defines the
                    mapping of one or more IP addresses to a specific subaccount and
                    domain. You can send 1 to 10 assignments per request.
                  items:
                    type: object
                    properties:
                      ip_address:
                        type: array
                        description: The dedicated IP addresses to assign to the subaccount.
                          Must be valid IPs owned by the parent account. Atleast one
                          IP is required; up to 100 can be included per assignment.
                          All IPs must belong to the same region.
                        items:
                          type: string
                          format: ipv4
                        minItems: 1
                        maxItems: 100
                        example:
                        - 192.168.1.100
                        - 192.168.1.101
                      account_name:
                        type: string
                        description: The Subaccount username that will receive the
                          IPs. The subaccount must exit and belong to the authenticated
                          parent account. Used to ensure the assignment is correctly
                          linked.
                        example: subaccount1
                      sending_domain:
                        type: string
                        description: The domain that the subaccount will use with
                          the assigned IPs. Must be an active, valid domain associated
                          with the subaccount. Ensures email authentication and reputation
                          are tied to the correct domain.
                        format: hostname
                        example: mail.example.com
                      region:
                        type: string
                        description: The geographic region of the IP addresses being
                          assigned. Supported values are `US`, `EU`, `IND`. If provided,
                          all IPs in the assignment must match the region.
                        enum:
                        - US
                        - EU
                        - IND
                        example: US
                    required:
                    - ip_address
                    - account_name
                    - sending_domain
                  minItems: 1
                  maxItems: 10
              required:
              - assignments
            example:
              assignments:
              - ip_address:
                - 192.168.1.100
                - 192.168.1.101
                account_name: subaccount1
                sending_domain: mail.example.com
                region: US
      responses:
        '200':
          description: IPs assigned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - success
                    - partial_success
                    - error
                    example: success
                  message:
                    type: string
                    example: All IPs were assigned successfully
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        account_name:
                          type: string
                          example: subaccount1
                        ip:
                          type: string
                          example: 192.168.1.100
                        sending_domain:
                          type: string
                          example: mail.example.com
                        status:
                          type: string
                          enum:
                          - success
                          - error
                          example: success
                        message:
                          type: string
                          example: IP assigned successfully
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          description: Error message
                        field:
                          type: string
                          description: Field name where error occurred
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          description: Error message
                        field:
                          type: string
                          description: Field name where error occurred
        '403':
          description: Access forbidden or ownership validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          description: Error message
                        field:
                          type: string
                          description: Field name where error occurred
      security:
      - bearer: []
  /ip/pool/subaccount/assign-pools:
    post:
      tags:
      - IP Management API
      summary: Assign pools to Subaccount
      description: This allows a parent account to manage which IP pools are available
        to a subaccount. You can add new pools or remove existing ones from a subaccount,
        ensuring that eacg subaccount has the correct set of IP pools for its sending
        need.
      operationId: assignPoolsToSubaccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                account:
                  type: string
                  description: The username of the subaccount to which pools will
                    be assigned or removed. The subaccount must exist and belong to
                    the authenticated parent account.
                  example: subaccount1
                sending_domain:
                  type: string
                  description: The domain associated with the subaccount. This must
                    be a valid domain owned by the account and is used to link pool
                    assignments to the correct sending domain.
                  format: hostname
                  example: mail.example.com
                pools_to_add:
                  type: array
                  description: A list of pool names to assign to the subaccount. Maximum
                    of 10 pools per request. Each pool must exist, belong to the parent
                    account, and not already be assigned to the subaccount.
                  items:
                    type: string
                  maxItems: 10
                  example:
                  - marketing-pool
                  - support-pool
                pools_to_remove:
                  type: array
                  description: A list of pool names to remove from the subaccount.
                    Maximum of 10 pools per request. Each pool must currently be assigned
                    to the subaccount.
                  items:
                    type: string
                  maxItems: 10
                  example:
                  - old-pool
              required:
              - account
              - sending_domain
            example:
              account: subaccount1
              sending_domain: mail.example.com
              pools_to_add:
              - marketing-pool
              - support-pool
              pools_to_remove:
              - old-pool
      responses:
        '200':
