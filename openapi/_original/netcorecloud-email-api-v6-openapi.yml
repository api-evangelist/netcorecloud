  /subaccounts:
    post:
      summary: Create Subaccount
      description: '**Creates a subaccount under your master account.** Subaccounts
        function like regular Email API accounts but are credit-controlled by the
        master account. By default, subaccounts have "unlimited" credit access from
        the master. To restrict usage, set `credit_type` to `one_time_credit` and
        allocate credits manually or on a recurring schedule. A confirmation email
        is sent to the provided address. If no password is set, the confirmation link
        also serves as a password setup link.'
      operationId: create-subaccount
      tags:
      - Subaccount APIs
      parameters:
      - name: Authorization
        in: header
        description: API key for authentication. Navigate to Netcore WhatsApp Dashboard
          > Settings > API Key.
        required: true
        example: Bearer <<API KEY>>
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: The username for the subaccount. Must be unique under
                    the master account
                email:
                  type: string
                  description: The email address associated with the subaccount
                password:
                  type: string
                  description: The password for the subaccount
                credit_type:
                  type: string
                  description: The credit allocation type. Can be either unlimited
                    or one_time_credit. Default is one_time_credit
                  enum:
                  - unlimited
                  - one_time_credit
              required:
              - username
              - email
              - password
            examples:
              create-subaccount-example:
                summary: Create Subaccount Example
                value:
                  username: subaccount1
                  email: subaccount1@example.com
                  password: securepassword123
                  credit_type: one_time_credit
      responses:
        '200':
          description: Subaccount created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  api_key:
                    type: string
              example:
                message: Subaccount created successfully.
                api_key: your_subaccount_api_key
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: Invalid Parameters
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: You cannot use this feature
      security:
      - bearer: []
    get:
      summary: List Subaccounts
      description: '**Retrieves a list of all subaccounts with optional filters**'
      operationId: list-subaccounts
      tags:
      - Subaccount APIs
      parameters:
      - name: username
        in: query
        description: Filter subaccounts by username
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: The number of records to return. Default is 10. Max is 1000
        required: false
        schema:
          type: integer
          maximum: 1000
      - name: offset
        in: query
        description: The number of records to skip. Default is 0
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Successful response with list of subaccounts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    username:
                      type: string
                    email:
                      type: string
                    disabled:
                      type: integer
                    credit_type:
                      type: object
                      properties:
                        type:
                          type: string
                        credits:
                          type: integer
              example:
              - username: subaccount1
                email: subaccount1@example.com
                disabled: 0
                credit_type:
                  type: one_time_credit
                  credits: 1000
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
