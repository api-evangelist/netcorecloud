  /webhooks/{id}:
    patch:
      summary: Partial Update Webhook
      description: 'Updates one or more fields of an existing webhook configuration.
        Only the fields provided in the request body will be modified.  This allows
        for non-destructive updates to webhook event mappings or headers.

        '
      operationId: partialUpdateWebhook
      tags:
      - Webhook APIs
      parameters:
      - name: id
        in: path
        description: Unique numeric ID of the webhook to partially update.
        required: true
        schema:
          type: integer
          format: int64
          example: 1
      - name: on-behalf-of
        in: header
        description: 'When a master account API key is used you can search domain
          for suppressions of the subaccount by providing subaccount username.

          '
        required: false
        schema:
          type: string
          example: subaccount_id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/paths/~1webhooks/post/requestBody/content/application~1json/schema'
            example:
              events:
                click: https://api.example.com/webhook/click
                open: https://api.example.com/webhook/open
              headers:
                Authorization: Bearer token123
                X-Custom-Header: updated-value
      responses:
        '204':
          description: Webhook partially updated successfully. No content is returned.
        '400':
          description: Bad Request – Invalid or malformed request data.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1webhooks/get/responses/400/content/application~1json/schema'
              example:
                error:
                - message: invalid event
                  field: cl1ick
        '401':
          description: Unauthorized – Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1webhooks/get/responses/400/content/application~1json/schema'
        '403':
          description: Forbidden – Insufficient permissions to update the webhook.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1webhooks/get/responses/400/content/application~1json/schema'
        '404':
          description: Webhook not found – No webhook exists with the given ID.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1webhooks/get/responses/400/content/application~1json/schema'
              examples:
                not_found:
                  value:
                    error: invalid_entry
        '500':
          description: Internal Server Error – Unexpected failure.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1webhooks/get/responses/400/content/application~1json/schema'
      security:
      - bearerAuth: []
    put:
      summary: Update Webhook
      description: 'Replaces an existing webhook configuration with a new set of event
        subscriptions and optional custom headers. All existing settings are overwritten.
        Use this to fully reset the configuration.

        '
      operationId: updateWebhook
      tags:
      - Webhook APIs
      parameters:
      - name: id
        in: path
        description: Unique numeric ID of the webhook to update.
        required: true
        schema:
          type: integer
          format: int64
          example: 1
      - name: on-behalf-of
        in: header
        description: When a master account API key is used, this header lets you retrieve
          webhook details for a subaccount by providing the subaccount's username.
        required: false
        schema:
          type: string
        example: subaccount_user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/paths/~1webhooks/post/requestBody/content/application~1json/schema'
            example:
              events:
                delivered: https://api.example.com/webhook/delivered
                open: https://api.example.com/webhook/open
                click: https://api.example.com/webhook/click
                bounce: https://api.example.com/webhook/bounce
                unsubscribe: https://api.example.com/webhook/unsubscribe
                spam: https://api.example.com/webhook/spam
                dropped: https://api.example.com/webhook/dropped
                invalid: https://api.example.com/webhook/invalid
                scheduled: https://api.example.com/webhook/scheduled
                cancelled: https://api.example.com/webhook/cancelled
              headers:
                Authorization: Bearer token123
                X-Custom-Header: value
      responses:
        '204':
          description: Webhook updated successfully. No content is returned.
        '400':
          description: Bad Request – One or more fields are invalid.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1webhooks/get/responses/400/content/application~1json/schema'
              example:
                error:
                - message: invalid event
                  field: cl1ick
        '401':
          description: Unauthorized – Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1webhooks/get/responses/400/content/application~1json/schema'
        '403':
          description: Forbidden – Insufficient permissions to update the webhook.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1webhooks/get/responses/400/content/application~1json/schema'
        '404':
          description: Webhook not found – The provided ID does not exist.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1webhooks/get/responses/400/content/application~1json/schema'
              examples:
                not_found:
                  value:
                    error: invalid_entry
        '500':
          description: Internal Server Error – Unexpected failure.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1webhooks/get/responses/400/content/application~1json/schema'
      security:
      - bearerAuth: []
    delete:
      summary: Delete Webhook
      description: 'Permanently deletes a specific webhook configuration based on
        its ID.

        Use this API to remove webhook callbacks for events such as delivered, open,
        or click. Deleting a webhook is irreversible.

        Note: When using a master account API key, you can delete a webhook for a
        subaccount by specifying the subaccount''s username in the `on-behalf-of`
        header.'
      operationId: webhookDelete
      tags:
      - Webhook APIs
      parameters:
      - name: id
        in: path
        description: ID of the webhook to delete.
        required: true
        schema:
          type: integer
      - name: on-behalf-of
        in: header
        description: 'Allows a master account to retrieve webhooks configured by a
          subaccount, by specifying the subaccount''s username.

          '
        required: false
        schema:
          type: string
          example: subaccount1
      responses:
        '204':
          description: Webhook deleted successfully
          headers: {}
        '400':
          description: Invalid webhook ID or malformed request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
              example:
                error: invalid_entry
          headers: {}
      security:
      - bearer: []
    get:
      summary: Get Webhook
      description: 'Retrieve the configuration details of a specific webhook, including
        the event URLs and custom headers.

        This API returns all the events (e.g., delivered, open, click) associated
        with the webhook, along with their respective callback URLs.

        Note: When using a master account API key, you can fetch webhook details for
        a subaccount by specifying the subaccount''s username in the `on-behalf-of`
        header.'
      operationId: webhookGet
      tags:
      - Webhook APIs
      parameters:
      - name: id
        in: path
        description: ID of the webhook to retrieve.
        required: true
        schema:
          type: integer
      - name: on-behalf-of
        in: header
        description: 'Allows a master account to retrieve webhooks configured by a
          subaccount, by specifying the subaccount''s username.

          '
        required: false
        schema:
          type: string
          example: subaccount1
      responses:
        '200':
          description: Webhook details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhook_id:
                    type: integer
                  events:
                    $ref: '#/paths/~1webhooks/post/requestBody/content/application~1json/schema/properties/events'
                  headers:
                    type: object
                    properties: {}
                    additionalProperties:
                      type: string
                required:
                - webhook_id
                - events
              example:
                webhook_id: 1
                events:
                  delivered: https://api.example.com/webhook/delivered
                  open: https://api.example.com/webhook/open
                  click: https://api.example.com/webhook/click
                headers:
                  Authorization: Bearer token123
                  X-Custom-Header: value
          headers: {}
        '400':
          description: Invalid webhook ID or malformed request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
              example:
                error: invalid_entry
          headers: {}
      security:
      - bearer: []
