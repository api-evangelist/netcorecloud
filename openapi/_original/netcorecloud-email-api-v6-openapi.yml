          Must follow format YYYY-MM-DD.
        required: false
        schema:
          type: string
          examples:
          - '2023-10-10'
      - name: aggregated_by
        in: query
        description: 'How to group the statistics. Must be one of: day, week, month,
          tag, fromdomain, recipientdomain, fromaddress, subaccount.'
        required: false
        schema:
          type: string
          enum:
          - day
          - week
          - month
          - tag
          - fromdomain
          - recipientdomain
          - fromaddress
          - subaccount
          default: day
      - name: on-behalf-of
        in: header
        description: When a master account API key is used you can fetch the summary
