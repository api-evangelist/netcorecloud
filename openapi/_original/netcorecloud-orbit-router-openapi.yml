  /v1s/nsend/:
    post:
      operationId: sendEmailNetcore
      tags:
      - Engine — Send
      summary: Send email (Netcore format)
      description: 'Send an email using **Netcore v6** payload format. Identical flow
        to `/v1s/ssend`

        except the incoming type is `netcore`. Content type keys differ:

        `text/html` → `html`, `text/plain` → `plain`, `categories` → `tags`.

        '
      security:
      - EngineApiKeyBearer: []
      - EngineApiKeyHeader: []
      - EngineApiKeyFallback: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetcorePayload'
            example:
              personalizations:
              - to:
                - email: recipient@example.com
                  name: Recipient
              from:
                email: sender@example.com
                name: Sender
              subject: Test Email
              content:
              - type: html
                value: <p>HTML body</p>
              tags:
              - transactional
              settings:
                open_track: true
                click_track: true
      responses:
        '200':
          description: Email relayed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineSuccessResponse'
        '400':
          $ref: '#/components/responses/EngineBadRequest'
        '401':
          $ref: '#/components/responses/EngineAuthFailed'
        '403':
          $ref: '#/components/responses/EngineForbidden'
        '413':
          $ref: '#/components/responses/EnginePayloadTooLarge'
        '500':
          $ref: '#/components/responses/EngineInternalError'
        '502':
          $ref: '#/components/responses/EngineProviderError'
        '504':
          $ref: '#/components/responses/EngineProviderTimeout'
  /v1s/ssend:
    post:
      operationId: sendEmailSendGrid
      tags:
      - Engine — Send
      summary: Send email (SendGrid format)
      description: 'Send an email using **SendGrid v3** payload format. The engine
        authenticates the request,

        evaluates rules, selects a route via weighted distribution, optionally transforms
        the

        payload if the target provider uses a different format, and forwards to the
        provider API.

        '
      security:
      - EngineApiKeyBearer: []
      - EngineApiKeyHeader: []
      - EngineApiKeyFallback: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendGridPayload'
            example:
              personalizations:
              - to:
                - email: recipient@example.com
                  name: Recipient
                cc:
                - email: cc@example.com
                bcc:
                - email: bcc@example.com
              from:
                email: sender@example.com
                name: Sender
              subject: Hello from Orbit Router
              content:
              - type: text/plain
                value: Plain text body
              - type: text/html
                value: <p>HTML body</p>
              attachments:
              - content: base64encodedcontent
                type: application/pdf
                filename: document.pdf
                disposition: attachment
              reply_to:
                email: reply@example.com
              categories:
              - transactional
      responses:
        '200':
          description: Email relayed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineSuccessResponse'
        '400':
          description: Invalid request (empty body, invalid JSON, payload validation
            failure, transform error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineErrorResponse'
              examples:
                emptyBody:
                  summary: Empty body
                  value:
                    success: error
                    error: request body is empty
                    error_code: empty_body
                invalidJson:
                  summary: Invalid JSON
                  value:
                    success: error
                    error: invalid JSON
                    error_code: invalid_json
                invalidPayload:
                  summary: Missing required fields
                  value:
                    success: error
                    error: missing from address
                    error_code: invalid_payload
        '401':
          description: Authentication failed — API key missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineErrorResponse'
              example:
                success: error
                error: authentication failed
                error_code: auth_failed
        '403':
          description: IP or domain restriction violation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineErrorResponse'
              examples:
                ipBlocked:
                  summary: IP not allowed
                  value:
                    success: error
                    error: IP not in allowed list
                    error_code: ip_not_allowed
                domainBlocked:
                  summary: Domain not allowed
                  value:
                    success: error
                    error: domain not in allowed list
                    error_code: domain_not_allowed
        '413':
          description: Payload exceeds `max_request_body_size_mb`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineErrorResponse'
        '500':
          description: Internal server error (rule evaluation, route lookup, etc.).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineErrorResponse'
        '502':
          description: Provider returned an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineErrorResponse'
        '504':
          description: Provider did not respond within the timeout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineErrorResponse'
