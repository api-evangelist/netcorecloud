# x-archived-from: netcorecloud-orbit-router-openapi.yml
# x-archived-on: 2026-10-13
openapi: 3.1.0
info:
  title: Orbit Router
  version: 1.0.0
  description: "Complete API specification for the Orbit Router email routing platform.\n\
    \n**Orbit Router** is a high-performance email routing system that receives emails\
    \ via SMTP\nand HTTP API, then intelligently routes them to multiple email service\
    \ providers based on\nconfigurable rules, weighted distribution, and client-specific\
    \ routing policies.\n\nThis specification is organized into two tag groups:\n\
    - **Orbit Engine** — HTTP Relay API for sending emails through the routing engine\
    \ (fasthttp).\n- **Orbit Backend** — Configuration & Management API for administering\
    \ providers, routes,\n  rules, users, and settings (gorilla/mux).\n"
  contact:
    name: Orbit Engineering
  license:
    name: Proprietary
servers:
- url: https://orbitus.netcorecloud.com
  description: Production — Orbit Engine (HTTP Relay)
- url: https://orbitus.netcorecloud.com/apiorbit
  description: Production — Orbit Backend (Config & Management)
tags:
- name: Engine — Cache
  description: Cache refresh endpoints for immediate config propagation.
security: []
components:
  responses:
    CacheRefreshSuccess:
      description: Cache cleared successfully.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: ok
              cache:
                type: string
                example: rules
              message:
                type: string
                example: rules cache cleared
    EngineBadRequest:
      description: Invalid request (empty body, invalid JSON, payload validation,
        transform error).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EngineErrorResponse'
    EngineAuthFailed:
      description: API key missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EngineErrorResponse'
    EngineForbidden:
      description: IP or domain restriction violation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EngineErrorResponse'
    EnginePayloadTooLarge:
      description: Payload exceeds `max_request_body_size_mb`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EngineErrorResponse'
    EngineInternalError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EngineErrorResponse'
    EngineProviderError:
      description: Upstream provider returned an error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EngineErrorResponse'
    EngineProviderTimeout:
      description: Upstream provider did not respond in time.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EngineErrorResponse'
  securitySchemes:
    BackendJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT token obtained from `POST /auth/login`. Access token lifetime:
        15 minutes.

        Claims: `user_id`, `client_id`, `role`, `jti`, `exp`, `iat`.

        '
    EngineApiKeyBearer:
      type: http
      scheme: bearer
      description: 'Engine API key via `Authorization: Bearer <api_key>` (priority
        1).'
    EngineApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: Engine API key via `X-API-Key` header (priority 2).
    EngineApiKeyFallback:
      type: apiKey
      in: header
      name: api_key
      description: Engine API key via `api_key` header (priority 3, fallback).
  schemas:
    ApiKeyCreated:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        key:
          type: string
          description: Full plaintext API key (shown once).
        type:
          type: string
          enum:
          - http
          - smtp
        created_at:
          type: string
          format: date-time
    BackendErrorResponse:
      type: object
      properties:
        error:
          type: string
        field:
          type: string
          description: Optional field that caused the error.
    Provider:
      type: object
      properties:
        id:
          type: integer
        provider_name:
          type: string
        protocol_type:
          type: string
          enum:
          - smtp
          - http
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
    ProviderCreate:
      type: object
      required:
      - provider_name
      - protocol_type
      properties:
        provider_name:
          type: string
        protocol_type:
          type: string
          enum:
          - smtp
          - http
        enabled:
          type: boolean
          default: true
    Route:
      type: object
      properties:
        id:
          type: integer
        provider_id:
          type: integer
        route_name:
          type: string
        host:
          type: string
        port:
          type: integer
          description: SMTP port; null for HTTP routes.
        username:
          type: string
          description: SMTP username (masked on read).
        password:
          type: string
          description: Masked value.
        api_key:
          type: string
          description: Masked value.
        status:
          type: string
          enum:
          - active
          - inactive
        protocol_type:
          type: string
          enum:
          - smtp
          - http
        worker_size:
          type: integer
        buffer_size:
          type: integer
        is_default:
          type: boolean
        tls_mode:
          type: string
          enum:
          - starttls
          - tls
          - none
        created_at:
          type: string
          format: date-time
    RouteCreate:
      type: object
      required:
      - provider_id
      - route_name
      - host
      properties:
        provider_id:
          type: integer
          description: Must exist in `providers` table.
        route_name:
          type: string
        host:
          type: string
          description: SMTP hostname or full HTTP URL.
        port:
          type: integer
          description: SMTP port (not used for HTTP).
        username:
          type: string
          description: SMTP username.
        password:
          type: string
          format: password
          description: AES-256 encrypted at rest.
        api_key:
          type: string
          description: HTTP provider API key; AES-256 encrypted at rest.
        status:
          type: string
          enum:
          - active
          - inactive
          default: active
        protocol_type:
          type: string
          enum:
          - smtp
          - http
        worker_size:
          type: integer
          default: 5
        buffer_size:
          type: integer
          default: 1000
        is_default:
          type: boolean
          description: Only one default per client.
        tls_mode:
          type: string
          enum:
          - starttls
          - tls
          - none
    RuleRouteAssignment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        provider_name:
          type: string
          readOnly: true
        route_id:
          type: integer
        route_name:
          type: string
          readOnly: true
        weight:
          type: integer
          minimum: 0
          maximum: 100
          description: Distribution weight.
        enabled:
          type: boolean
          default: true
    Rule:
      type: object
      properties:
        id:
          type: integer
        client_id:
          type: integer
        rule_name:
          type: string
        tag:
          type: string
        priority:
          type: integer
          description: Lower number = higher priority.
        expression:
          type: string
          description: 'Expression evaluated by `expr.Compile()`. Available variables:

            `from_address`, `from_domain`, `from_local`, `to_address`, `to_domain`,

            `to_local`, `headers`, `remote_ip`, `helo`, `size`.

            Helper functions: `StartsWith()`, `EndsWith()`, `Contains()`, `Matches()`,

            `ToLower()`, `ToUpper()`, `Trim()`.

            '
        enabled:
          type: boolean
        rule_routes:
          type: array
          items:
            $ref: '#/components/schemas/RuleRouteAssignment'
        created_at:
          type: string
          format: date-time
    RuleCreate:
      type: object
      required:
      - rule_name
      - expression
      - priority
      - enabled
      properties:
        rule_name:
          type: string
        expression:
          type: string
          description: Must compile with `expr.Compile()`.
        tag:
          type: string
          default: default
        priority:
          type: integer
          description: Lower number = higher priority.
        enabled:
          type: boolean
        rule_routes:
          type: array
          items:
            type: object
            required:
            - route_id
            - weight
            properties:
              route_id:
                type: integer
                description: Must exist for the current client.
              weight:
                type: integer
                minimum: 0
                maximum: 100
              enabled:
                type: boolean
                default: true
    ClientSummary:
      type: object
      properties:
        client_id:
          type: integer
        clientname:
          type: string
        status:
          type: string
          enum:
          - active
          - inactive
    UserProfile:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          type: string
          enum:
          - admin
          - viewer
        client_id:
          type: integer
        two_factor_enabled:
          type: boolean
    UserCreate:
      type: object
      required:
      - username
      - email
      - password
      - role
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        role:
          type: string
          enum:
          - admin
          - viewer
        allowed_subclient_ids:
          type: array
          items:
            type: integer
          description: Sub-client IDs this user may access.
    DashboardStats:
      type: object
      properties:
        totalRoutes:
          type: integer
        enabledRoutes:
          type: integer
        totalRules:
          type: integer
        activeRules:
          type: integer
        totalProviders:
          type: integer
        totalUsers:
          type: integer
    IpWhitelist:
      type: object
      properties:
        enabled:
          type: boolean
        ips:
          type: string
          description: Comma-separated IP addresses.
    MetricsResponse:
      type: object
      properties:
        total_requests:
          type: integer
          example: 15230
        success_requests:
          type: integer
          example: 14980
        failed_requests:
          type: integer
          example: 250
        in_flight:
          type: integer
          example: 3
        uptime_seconds:
          type: integer
          example: 86400
    SmtpConfig:
      type: object
      properties:
        default_from_email:
          type: string
          format: email
        default_from_name:
          type: string
        bounce_email:
          type: string
          format: email
        max_retries:
          type: string
        retry_interval_seconds:
          type: string
    ApiKeySummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        preview:
          type: string
          description: Masked key preview.
        type:
          type: string
          enum:
          - http
          - smtp
        created_at:
          type: string
          format: date-time
    AuditLogEntry:
      type: object
      properties:
        id:
          type: integer
        client_id:
          type: integer
        user_id:
          type: integer
        username:
          type: string
        action:
          type: string
          enum:
          - login
          - logout
          - create
          - update
          - delete
        resource_type:
          type: string
          enum:
          - user
          - route
          - rule
          - provider
        resource_name:
          type: string
        ip_address:
          type: string
        created_at:
          type: string
          format: date-time
    AuditLogPage:
      type: object
      properties:
        logs:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntry'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
    IncomingAuth:
      type: object
      properties:
        id:
          type: integer
        client_id:
          type: integer
        protocol_type:
          type: string
          enum:
          - smtp
          - https
        username:
          type: string
        allowed_ips:
          type: string
          description: Comma-separated IPs or `*` for wildcard.
        allowed_domains:
          type: string
          description: Comma-separated domains or `*` for wildcard.
    LoginRequest:
      type: object
      required:
      - account_name
      - password
      properties:
        account_name:
          type: string
          description: Client/workspace name from `client_details.clientname`.
        username:
          type: string
          description: Username (provide either `username` or `email`).
        email:
          type: string
          format: email
          description: Alternative to `username`.
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT access token (15-minute lifetime).
        refresh_token:
          type: string
          description: Refresh token (7-day lifetime).
        refresh_expires_at:
          type: string
          format: date-time
        client_id:
          type: integer
        clients:
          type: array
          items:
            $ref: '#/components/schemas/ClientSummary'
        is_parent:
          type: boolean
        user:
          $ref: '#/components/schemas/UserProfile'
    TwoFactorRequiredResponse:
      type: object
      properties:
        two_factor_required:
          type: boolean
          example: true
        user_id:
          type: integer
        client_id:
          type: integer
    EmailAddress:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
        name:
          type: string
    SendGridPersonalization:
      type: object
      required:
      - to
      properties:
        to:
          type: array
          items:
            $ref: '#/components/schemas/EmailAddress'
          minItems: 1
        cc:
          type: array
          items:
            $ref: '#/components/schemas/EmailAddress'
        bcc:
          type: array
          items:
            $ref: '#/components/schemas/EmailAddress'
        subject:
          type: string
          description: Overrides top-level subject for this personalization.
    NetcoreContent:
      type: object
      required:
      - type
      - value
      properties:
        type:
          type: string
          enum:
          - html
          - plain
          description: '`html` maps to `text/html`, `plain` maps to `text/plain`.'
        value:
          type: string
    NetcorePayload:
      type: object
      required:
      - personalizations
      - from
      properties:
        personalizations:
          type: array
          items:
            $ref: '#/components/schemas/SendGridPersonalization'
          minItems: 1
        from:
          $ref: '#/components/schemas/EmailAddress'
        subject:
          type: string
        content:
          type: array
          items:
            $ref: '#/components/schemas/NetcoreContent'
        tags:
          type: array
          items:
            type: string
          description: Equivalent to SendGrid `categories`.
        settings:
          type: object
          properties:
            open_track:
              type: boolean
            click_track:
              type: boolean
    EngineSuccessResponse:
      type: object
      properties:
        success:
          type: string
          example: ok
        req_id:
          type: string
          description: 'Unique request ID: `{rand6}-{clusterID}-{providerID}-{timestamp}-{sequence}-{clientID}-{routeID}`.

            '
          example: f85l13-1-2-260310161455-000-2-11
        message:
          type: string
          example: Message relayed successfully
    EngineErrorResponse:
      type: object
      properties:
        success:
          type: string
          example: error
        error:
          type: string
        error_code:
          type: string
          enum:
          - empty_body
          - payload_too_large
          - invalid_json
          - invalid_payload
          - transform_failed
          - marshal_failed
          - auth_failed
          - auth_error
          - ip_not_allowed
          - domain_not_allowed
          - rule_eval_failed
          - route_not_found
          - internal_error
          - provider_error
          - provider_timeout
        req_id:
          type: string
    SendGridContent:
      type: object
      required:
      - type
      - value
      properties:
        type:
          type: string
          enum:
          - text/plain
          - text/html
        value:
          type: string
    SendGridAttachment:
      type: object
      required:
      - content
      - filename
      properties:
        content:
          type: string
          description: Base64-encoded file content.
        type:
          type: string
          description: MIME type.
        filename:
          type: string
        disposition:
          type: string
          enum:
          - attachment
          - inline
          default: attachment
    SendGridPayload:
      type: object
      required:
      - personalizations
      - from
      properties:
        personalizations:
          type: array
          items:
            $ref: '#/components/schemas/SendGridPersonalization'
          minItems: 1
        from:
          $ref: '#/components/schemas/EmailAddress'
        subject:
          type: string
        content:
          type: array
          items:
            $ref: '#/components/schemas/SendGridContent'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/SendGridAttachment'
        reply_to:
          $ref: '#/components/schemas/EmailAddress'
        categories:
          type: array
          items:
            type: string
    TwoFactorSetupResponse:
      type: object
      properties:
        secret:
          type: string
          description: TOTP secret key.
          example: JBSWY3DPEHPK3PXP
        provisioning_uri:
          type: string
          description: OTP auth URI for authenticator apps.
        qr_code:
          type: string
          description: Base64-encoded QR code image (data URI).
    SignupRequest:
      type: object
      required:
      - accountName
      - fullName
      - email
      - password
      properties:
        accountName:
          type: string
          description: Unique account name.
        fullName:
          type: string
        email:
          type: string
          format: email
          description: Unique across all users (case-insensitive).
        password:
          type: string
          format: password
    TestSendRequest:
      type: object
      required:
      - from
      - to
      - api_key
      - host
      properties:
        from:
          type: string
          format: email
        to:
          type: string
          format: email
        api_key:
          type: string
          description: Provider API key (sent directly to provider).
        host:
          type: string
          format: uri
          description: 'Provider endpoint URL. Provider detection:

            `pepipost.com` → Netcore, `sendgrid.com` → SendGrid, other → 400.

            '
    TestSendResponse:
      type: object
      properties:
        provider:
          type: string
          example: netcore
        status_code:
          type: string
          example: '202'
        response:
          type: string
          description: Raw provider response body.
    IncomingAuthUpsert:
      type: object
      required:
      - protocol_type
      properties:
        protocol_type:
          type: string
          enum:
          - smtp
          - https
        username:
          type: string
          description: SMTP username.
        password:
          type: string
          format: password
          description: SHA-256 hashed before storage.
        api_key:
          type: string
          description: For HTTP; hashed before storage.
        api_key_id:
          type: integer
          description: Reference to `api_keys.id`.
        allowed_ips:
          type: string
          description: Comma-separated IPs or `*`.
        allowed_domains:
          type: string
          description: Comma-separated domains or `*`.
    TwoFactorVerifyRequest:
      type: object
      required:
      - user_id
      - client_id
      - code
      properties:
        user_id:
          type: integer
        client_id:
          type: integer
        code:
          type: string
          description: 6-digit TOTP code.
          pattern: ^\d{6}$
        setup:
          type: boolean
          default: false
          description: Set to `true` during initial 2FA setup confirmation.
    TwoFactorSetupConfirmResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        backup_codes:
          type: array
          items:
            type: string
          description: One-time backup codes; store securely.
  parameters:
    ClientIdHeader:
      name: X-Client-ID
      in: header
      required: false
      schema:
        type: integer
      description: Switch client context (multi-tenant).
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Resource ID.
x-readme:
  explorer-enabled: true
  proxy-enabled: true
paths:
  /v1/cache/refresh/all:
    post:
      operationId: cacheRefreshAll
      tags:
      - Engine — Cache
      summary: Refresh all caches
      description: Clears all caches (rules, routes, auth, distribution) at once.
      security: []
      responses:
        '200':
          $ref: '#/components/responses/CacheRefreshSuccess'
  /v1/cache/refresh/auth:
    post:
      operationId: cacheRefreshAuth
      tags:
      - Engine — Cache
      summary: Refresh auth cache
      description: Clears auth cache (API key, SMTP user).
      security: []
      responses:
        '200':
          $ref: '#/components/responses/CacheRefreshSuccess'
  /v1/cache/refresh/routes:
    post:
      operationId: cacheRefreshRoutes
      tags:
      - Engine — Cache
      summary: Refresh routes cache
      description: Clears route and distribution caches.
      security: []
      responses:
        '200':
          $ref: '#/components/responses/CacheRefreshSuccess'
  /v1/cache/refresh/rules:
    post:
      operationId: cacheRefreshRules
      tags:
      - Engine — Cache
      summary: Refresh rules cache
      description: Clears client rules and global rules caches. Changes take effect
        immediately.
      security: []
      responses:
        '200':
          $ref: '#/components/responses/CacheRefreshSuccess'
  /auth/password:
    put:
      operationId: changePassword
      tags:
      - Auth
      summary: Change own password
      security:
      - BackendJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - new_password
              properties:
                new_password:
                  type: string
                  format: password
      responses:
        '200':
          description: Password changed.
        '401':
          description: Unauthorized.
  /auth/check-account:
    get:
      operationId: checkAccount
      tags:
      - Auth
      summary: Check if account exists
      security: []
      parameters:
      - name: name
        in: query
        required: true
        schema:
          type: string
        description: Account name to check.
      responses:
        '200':
          description: Account existence result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  exists:
                    type: boolean
  /config/api-keys:
    post:
      operationId: createApiKey
      tags:
      - Configuration
      summary: Create an API key
      description: 'Returns the full plaintext API key **once**. The backend stores
        only the SHA-256 hash.

        Store your key securely immediately.

        '
      security:
      - BackendJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - type
              properties:
                name:
                  type: string
                type:
                  type: string
                  enum:
                  - http
                  - smtp
      responses:
        '201':
          description: API key created (includes full plaintext key).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'
    get:
      operationId: listApiKeys
      tags:
      - Configuration
      summary: List API keys
      description: Returns masked key previews only.
      security:
      - BackendJWT: []
      responses:
        '200':
          description: List of API keys (masked).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKeySummary'
  /providers:
    post:
      operationId: createProvider
      tags:
      - Providers
      summary: Create a provider
      security:
      - BackendJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderCreate'
      responses:
        '201':
          description: Provider created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendErrorResponse'
    get:
      operationId: listProviders
      tags:
      - Providers
      summary: List all providers
      security:
      - BackendJWT: []
      responses:
        '200':
          description: List of providers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Provider'
  /routes:
    post:
      operationId: createRoute
      tags:
      - Routes
      summary: Create a route
      description: Passwords and API keys are AES-256 encrypted at rest.
      security:
      - BackendJWT: []
      parameters:
      - $ref: '#/components/parameters/ClientIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteCreate'
      responses:
        '201':
          description: Route created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendErrorResponse'
    get:
      operationId: listRoutes
      tags:
      - Routes
      summary: List all routes
      description: Lists routes for the current client. Passwords are masked; API
        keys are decrypted and masked.
      security:
      - BackendJWT: []
      parameters:
      - $ref: '#/components/parameters/ClientIdHeader'
      responses:
        '200':
          description: List of routes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Route'
  /rules:
    post:
      operationId: createRule
      tags:
      - Rules
      summary: Create a rule
      description: Creates a new rule with route assignments. Expression is validated
        at creation time.
      security:
      - BackendJWT: []
      parameters:
      - $ref: '#/components/parameters/ClientIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleCreate'
      responses:
        '201':
          description: Rule created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
        '400':
          description: Validation error (invalid expression, missing fields).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendErrorResponse'
    get:
      operationId: listRules
      tags:
      - Rules
      summary: List all rules
      description: Lists rules for the current client, including associated route
        assignments with weights.
      security:
      - BackendJWT: []
      parameters:
      - $ref: '#/components/parameters/ClientIdHeader'
      responses:
        '200':
          description: List of rules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rule'
  /clients:
    post:
      operationId: createSubClient
      tags:
      - Clients
      summary: Create a sub-client
      security:
      - BackendJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
