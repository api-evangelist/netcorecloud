      summary: Query audit logs
      description: Admin-only. Supports filtering and pagination.
      security:
      - BackendJWT: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
          maximum: 100
      - name: action
        in: query
        schema:
          type: string
          enum:
          - login
          - logout
          - create
          - update
          - delete
      - name: resource_type
        in: query
        schema:
          type: string
          enum:
          - user
          - route
          - rule
          - provider
      - name: username
        in: query
        schema:
          type: string
      - name: resource_name
        in: query
        schema:
          type: string
      - name: user_id
        in: query
        schema:
          type: integer
      - name: from_date
        in: query
        schema:
          type: string
          format: date
        description: ISO date, e.g. `2026-03-01`.
      - name: to_date
        in: query
        schema:
          type: string
          format: date
      - name: search
        in: query
        schema:
          type: string
        description: Free-text search in details.
      responses:
        '200':
          description: Paginated audit logs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
