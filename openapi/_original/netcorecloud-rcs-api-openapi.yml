  /template:
    get:
      summary: Fetch Template API
      tags:
      - Template APIs
      security:
      - bearerAuth: []
      description: Fetch your approved RCS templates. Apply query parameters to refine
        results. No request body is required.
      parameters:
      - schema:
          type: string
          example: a3f1d5e792bc4e8aa6785c9d12f30b44
        in: header
        name: api_key
        description: Enter your API key for authentication.
        required: true
      - schema:
          type: string
        in: header
        name: Content-Type
        description: Set this to application/json.
        required: true
      - schema:
          type: string
        in: query
        name: status
        description: Filter templates by status (e.g., approved).
      - schema:
          type: string
        in: query
        name: limit
        description: Set the number of templates to return.
      - schema:
          type: string
        in: query
        name: exclude_type
        description: Exclude templates of a specific type (e.g., rich_card).
      - schema:
          type: string
        in: query
        name: template_type
        description: Filter templates by type (e.g., carousel).
      - schema:
          type: string
        in: query
        name: offset
        description: Skip a specific number of records before fetching results.
      - schema:
          type: string
        in: query
        name: name
        description: Search for a template by name.
      - schema:
          type: string
          example: abc123
        in: header
        name: nc_bot_id
        description: Optional bot ID. If not provided, the default bot configured
          on your panel will be used.
      responses:
        '200':
          description: "Successfully fetched template data.\n\n```\n{\n   \"status\"\
            :\"success\",\n   \"message\":\"Data fetched successfully\",\n   \"client_id\"\
            :<CLIENT_ID>,\n   \"data\":{\n      \"bot_id\":\"<BOT_ID>\",\n      \"\
            bot_type\":\"Promotional\",\n      \"bot_name\":\"Netcore Cloud promotional\"\
            ,\n      \"templates\":[\n         {\n            \"template_id\":<TEMPLATE_ID>,\n\
            \            \"template_name\":\"<TEMPLATE_NAME>\",\n            \"template_type\"\
            :\"carousel\",\n            \"template_status\":\"approved\",\n      \
            \      \"display_template_type\":\"Rich card carousel\",\n           \
            \ \"created_at\":\"2024-04-24 17:13:09\",\n            \"modified_at\"\
            :\"2024-04-24 17:13:09\"\n         }\n      ],\n      \"total_rows\":1\n\
            \   }\n}\n```\n\nNo templates found:\n\n```\n{\n   \"status\":\"success\"\
            ,\n   \"message\":\"No data found\",\n   \"client_id\":77865,\n   \"data\"\
            :{\n      \"templates\":[],\n      \"total_rows\":0\n   }\n}\n```\n"
        '400':
          description: "Returned for invalid authentication or incorrect content type.\n\
            \nInvalid API key:\n```\n{\n   \"errors\":[\n      {\n         \"message\"\
            :\"Authorization Failed, invalid token\",\n         \"field\":\"api_key\"\
            \n      }\n   ]\n}\n```\n\nInvalid content type:\n```\n{\n   \"errors\"\
            :[\n      {\n         \"message\":\"ContentType not valid\",\n       \
            \  \"field\":\"ContentType\"\n      }\n   ]\n}\n```\n"
      operationId: ''
      x-stoplight:
        id: 59tk0a7un2i7i
    parameters: []
