  /template/edit:
    put:
      summary: Edit RCS Carousel Message API
      tags:
      - Template APIs
      security:
      - bearerAuth: []
      description: Send the updated details of your carousel template in this request.
        Ensure all authentication headers are included.
      parameters:
      - schema:
          type: string
          example: a3f1d5e792bc4e8aa6785c9d12f30b44
        in: header
        name: api_key
        description: Enter your API key for authentication.
        required: true
      - schema:
          type: string
        in: header
        name: Content-Type
        description: Set this to application/json.
        required: true
      - schema:
          type: string
          example: abc123
        in: header
        name: nc_bot_id
        description: Optionally specify the bot ID. If not passed, the default bot
          for your account is used.
      requestBody:
        description: Send your updated template details in the request payload.
        content:
          application/json:
            schema:
              type: object
              required:
              - action_type
              properties:
                action_type:
                  type: string
                  description: Enter the action type. For carousel updates, use "carousel".
                payload:
                  type: object
                  required:
                  - card_width
                  - card_height
                  - rcs_type
                  - cards
                  - template_name
                  properties:
                    card_width:
                      type: string
                      description: Select the card width (e.g., "SMALL_WIDTH", "MEDIUM_WIDTH").
                    card_height:
                      type: string
                      description: Select the card height (e.g., "SHORT_HEIGHT", "MEDIUM_HEIGHT").
                    rcs_type:
                      type: string
                      description: Use "carousel" to define the message type.
                    cards:
                      type: array
                      description: Add one or more cards to include in the carousel.
                      items:
                        type: object
                        required:
                        - type
                        properties:
                          type:
                            type: integer
                            description: Specify the card type. A value of 2 supports
                              suggestions or actions.
                          image_file:
                            type: string
                            description: Upload the image or video as a base64 file.
                          url:
                            type: string
                            description: Provide the direct media URL.
                          thumbnail_url:
                            type: string
                            description: Provide the thumbnail image URL.
                          thumbnail_file:
                            type: string
                            description: Upload the thumbnail file as base64.
                          title:
                            type: string
                            description: Enter the card title.
                          description:
                            type: string
                            description: Enter the card description.
                          suggestions:
                            type: array
                            description: Add suggestion actions like replies, URLs,
                              or dial actions.
                            items:
                              type: object
                              properties:
                                suggestionType:
                                  type: string
                                  description: Choose a suggestion type such as "reply",
                                    "url_action", or "dialer_action".
                                displayText:
                                  type: string
                                  description: Enter the label shown to users.
                                postback:
                                  type: string
                                  description: Enter the data returned when the user
                                    selects the suggestion.
                                url:
                                  type: string
                                  description: Enter the URL for URL actions.
                    template_name:
                      type: string
                      description: Enter the name of the template being edited.
