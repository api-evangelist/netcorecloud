  /template/create:
    post:
      summary: Create RCS Carousel Template
      tags:
      - Template APIs
      operationId: ''
      security:
      - bearerAuth: []
      description: Send template creation details in the JSON request body. Use this
        API to create text templates, single rich cards, or multi-card carousel templates.
      responses:
        '200':
          description: "Template created successfully.\n\n**With suggestions**\n```\n\
            {\n  \"message\": \"Template created successfully\",\n  \"payload\": {\n\
            \    \"name\": \"text_message_demo\",\n    \"type\": \"text_message\"\
            ,\n    \"botId\": \"OCHhY1alm8nJfSnj\",\n    \"textMessageContent\": \"\
            Time to go big or go home because it's India VS Australia FINALS!\",\n\
            \    \"suggestions\": [\n      {\n        \"suggestionType\": \"reply\"\
            ,\n        \"postback\": \"click_to_win\",\n        \"displayText\": \"\
            Click to Win\"\n      },\n      {\n        \"suggestionType\": \"url_action\"\
            ,\n        \"postback\": \"answer_and_win\",\n        \"displayText\"\
            : \"Answer and Win\",\n        \"url\": \"https://brandx.onelink.me/\"\
            \n      },\n      {\n        \"suggestionType\": \"dialer_action\",\n\
            \        \"postback\": \"call_now_fast\",\n        \"displayText\": \"\
            Call Now Fast\",\n        \"phoneNumber\": \"+919876543212\"\n      }\n\
            \    ],\n    \"createdViaApi\": true\n  },\n  \"status\": \"Success\"\n\
            }\n```\n\n**Without suggestions**\n```\n{\n  \"message\": \"Template created\
            \ successfully\",\n  \"payload\": {\n    \"name\": \"text_message_demo\"\
            ,\n    \"type\": \"text_message\",\n    \"botId\": \"OCHhY1alm8nJfSnj\"\
            ,\n    \"textMessageContent\": \"Time to go big or go home because it's\
            \ India VS Australia FINALS!\",\n    \"createdViaApi\": true\n  },\n \
            \ \"status\": \"Success\"\n}\n```\n"
        '400':
          description: "Template creation failed.\n\n**Template already exists**\n\
            ```\n{\n  \"error\": \"Template with same name is already present.\",\n\
            \  \"message\": \"Template creation failed\",\n  \"status\": \"Failure\"\
            \n}\n```\n\n**Missing field**\n```\n{\n  \"error\": \"missing required\
            \ field: rcs_type\",\n  \"message\": \"Template creation failed\",\n \
            \ \"status\": \"Failure\"\n}\n```\n\n**Name length validation**\n```\n\
            {\n  \"error\": \"The length of 'template_name' cannot be more than 20\
            \ characters\",\n  \"message\": \"Template creation failed\",\n  \"status\"\
            : \"Failure\"\n}\n```\n"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                action_type:
                  type: string
                  description: Enter the message type you want to create.
                payload:
                  type: object
                  required:
                  - template_name
                  - rcs_type
                  - template_content
                  properties:
                    template_name:
                      type: string
                      description: Enter a unique template name.
                    rcs_type:
                      type: string
                      description: Enter the RCS message type (text_message, rich_card,
                        carousel).
                    template_content:
                      type: string
                      description: Enter the message content for text templates.
                    suggestions:
                      type: array
                      description: Add action buttons to the template.
                      items:
                        type: object
                        properties:
                          suggestionType:
                            type: string
                            description: Enter the action type (reply, url_action,
                              dialer_action, etc.).
                          displayText:
                            type: string
                            description: Enter the button label.
                          postback:
                            type: string
                            description: Enter the identifier for tracking button
                              interactions.
                          url:
                            type: string
                            description: Enter the URL for URL-type actions.
                          phoneNumber:
                            type: string
                            description: Enter the phone number for dialer actions.
                    card_width:
                      description: Placeholder — width setting for carousel cards.
                    card_height:
                      description: Placeholder — height setting for carousel cards.
                    save_type:
                      description: Placeholder — indicates whether to add or update
                        the template.
                    cards:
                      description: Placeholder — array of cards for carousel templates.
                    type:
                      description: Placeholder — message subtype for rich cards.
                    template_id:
                      description: Placeholder — internal template ID for updates.
            examples:
