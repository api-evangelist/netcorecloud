                      template_type: text_message
                      template_status: auto-approved
                      template_content: Hello welocme to netcore
                      orientation: ''
                      alignment: ''
                      height: ''
                      width: ''
                      suggestion_details:
                      - suggestion_type: '2'
                        suggestion: '{"displayText":"Visit half","postback":"Visit
                          half","url":"https://www.netcorecloud.com/","webview":"Half"}'
                      - suggestion_type: '1'
                        suggestion: '{"displayText":"Click here","postback":"Click
                          here"}'
                      - suggestion_type: '8'
                        suggestion: '{"displayText":"Visit Tall","postback":"Visit
                          Tall","url":"https://www.netcorecloud.com","domain":"https://qa.nctrckg.com","suggestionAttr":"[button_3_url]","webview":"Tall"}'
                      - suggestion_type: '2'
                        suggestion: '{"displayText":"Visit Full","postback":"Visit
                          Full","url":"https://www.abcccccc.com/","webview":"Full"}'
                      - suggestion_type: '2'
                        suggestion: '{"displayText":"Visit Default","postback":"Visit
                          Default","url":"https://www.netcorecloud.com/"}'
                      - suggestion_type: '4'
                        suggestion: '{"displayText":"Get Location","postback":"Get
                          Location","latitude":"23.455","longitude":"54.566","label":"Netcore"}'
                      created_date: '2025-11-07 18:41:08'
                      updated_date: '2025-11-07 18:45:00'
        '400':
          description: "Returned for invalid authentication, incorrect content type,\
            \ or missing/invalid template_id.\n\n**Invalid API Key:**\n```\n{\n  \
            \  \"errors\": [\n        {\n            \"message\": \"Authorization\
            \ Failed, invalid token\",\n            \"field\": \"api_key\"\n     \
            \   }\n    ]\n}\n```\n\n**Invalid Content Type:**\n```\n{\n    \"errors\"\
            : [\n        {\n            \"message\": \"ContentType not valid\",\n\
            \            \"field\": \"ContentType\"\n        }\n    ]\n}\n```\n\n\
            **Missing or Invalid Template ID:**\n```\n{\n    \"errors\": [\n     \
            \   {\n            \"message\": \"Template ID is required\",\n       \
            \     \"field\": \"template_id\"\n        }\n    ]\n}\n```\n"
        '404':
          description: "Template not found.\n\n```\n{\n    \"status\": \"error\",\n\
            \    \"message\": \"Template not found\",\n    \"template_id\": 9753\n\
            }\n```\n"
      operationId: ''
      x-stoplight:
        id: template_preview_endpoint
      x-internal: false
