info:
  title: RCS API
  version: '1.0'
  description: 'Comprehensive collection of RCS APIs that allow users to interact
    with .

    '
  license:
    name: Proprietary
    identifier: proprietary
servers:
- url: https://soipapi.netcorecloud.com
  description: WhatsApp APIs Server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token authentication using JWT. Include the token in the
        Authorization header as 'Bearer <your_token>'.
paths:
  /rcs/botinfo:
    get:
      summary: Fetch Bot Info API
      tags:
      - Template APIs
      security:
      - bearerAuth: []
      description: "Use this endpoint to retrieve bot metadata without sending a request\
        \ body.  \nPass all required values as query parameters or headers.\n"
      parameters:
      - schema:
          type: string
          example: a3f1d5e792bc4e8aa6785c9d12f30b44
        in: header
        name: api_key
        description: Enter your RCS API key for authentication.
        required: true
      - schema:
          type: string
        in: header
        name: Content-Type
        description: Must be set to application/json.
        required: true
      - schema:
          type: string
        in: query
        name: type
        description: 'Enter the bot type you want to filter by. For example: Promotional.'
      - schema:
          type: string
          example: abc123
        in: header
        name: nc_bot_id
        description: "Optional. Enter the unique bot identifier from the RCS Dashboard.\
          \  \nIf not provided, the system uses the default bot configured in your\
          \ panel.\n"
      responses:
        '200':
          description: "**Success Response — Bot details found**\n\n```\n{\n    \"\
            status\": \"success\",\n    \"message\": \"Data fetched successfully\"\
            ,\n    \"client_id\": <client_id>,\n    \"data\": {\n        \"bot_details\"\
            : [\n            {\n                \"botId\": \"<bot_id>\",\n       \
            \         \"bot_type\": \"Promotional\",\n                \"bot_name\"\
            : \"Netcore Cloud promotional\"\n            }\n        ]\n    }\n}\n\
            ```\n\n**Success Response — No data found**\n\n```\n{\n  \"status\": \"\
            success\",\n  \"message\": \"No data found\",\n  \"client_id\": <client_id>,\n\
            \  \"data\": {\n    \"bots\": []\n  }\n}\n```\n"
        '400':
          description: "**Invalid API Key**\n\n```\n{\n   \"errors\":[\n      {\n\
            \         \"message\":\"Authorization Failed, invalid token\",\n     \
            \    \"field\":\"api_key\"\n      }\n   ]\n}\n```\n\n**Invalid Content\
            \ Type**\n\n```\n{\n   \"errors\":[\n      {\n         \"message\":\"\
            ContentType not valid\",\n         \"field\":\"ContentType\"\n      }\n\
            \   ]\n}\n```\n"
      operationId: ''
      x-stoplight:
        id: wg9ndju0z58jg
      x-internal: false
    parameters: []
  /rcs/template/preview:
    get:
      summary: Template Preview API
      tags:
      - Template APIs
      security:
      - bearerAuth: []
      description: 'Retrieve detailed preview information for a specific RCS template.

        This endpoint returns template content, status, orientation, alignment, and
        all suggestion details.

        '
      parameters:
      - schema:
          type: string
          example: a3f1d5e792bc4e8aa6785c9d12f30b44
        in: header
        name: api_key
        description: Enter your API key for authentication.
        required: true
      - schema:
          type: string
          example: application/json
        in: header
        name: Content-Type
        description: Must be set to application/json.
        required: true
      - schema:
          type: integer
          example: 9753
        in: query
        name: template_id
        description: The ID of the template to preview.
        required: true
      - schema:
          type: string
          example: abc123
        in: header
        name: nc_bot_id
        description: 'Optional bot ID. If not provided, the default bot configured
          on your panel will be used.

          You can locate the nc_bot_id in the General Settings on the CPaaS >> Bot
          ID.

          '
      responses:
        '200':
          description: "Successfully fetched template preview data.\n\n```\n{\n  \
            \  \"status\": \"success\",\n    \"message\": \"Data fetched successfully\"\
            ,\n    \"template_id\": 9753,\n    \"data\": {\n        \"template_name\"\
            : \"test_half\",\n        \"template_type\": \"text_message\",\n     \
            \   \"template_status\": \"auto-approved\",\n        \"template_content\"\
            : \"Hello welocme to netcore\",\n        \"orientation\": \"\",\n    \
            \    \"alignment\": \"\",\n        \"height\": \"\",\n        \"width\"\
            : \"\",\n        \"suggestion_details\": [\n            {\n          \
            \      \"suggestion_type\": \"2\",\n                \"suggestion\": \"\
            {\\\"displayText\\\":\\\"Visit half\\\",\\\"postback\\\":\\\"Visit half\\\
            \",\\\"url\\\":\\\"https://www.netcorecloud.com/\\\",\\\"webview\\\":\\\
            \"Half\\\"}\"\n            },\n            {\n                \"suggestion_type\"\
            : \"1\",\n                \"suggestion\": \"{\\\"displayText\\\":\\\"\
            Click here\\\",\\\"postback\\\":\\\"Click here\\\"}\"\n            },\n\
            \            {\n                \"suggestion_type\": \"8\",\n        \
            \        \"suggestion\": \"{\\\"displayText\\\":\\\"Visit Tall\\\",\\\"\
            postback\\\":\\\"Visit Tall\\\",\\\"url\\\":\\\"https://www.netcorecloud.com\\\
            \",\\\"domain\\\":\\\"https://qa.nctrckg.com\\\",\\\"suggestionAttr\\\"\
            :\\\"[button_3_url]\\\",\\\"webview\\\":\\\"Tall\\\"}\"\n            },\n\
            \            {\n                \"suggestion_type\": \"2\",\n        \
            \        \"suggestion\": \"{\\\"displayText\\\":\\\"Visit Full\\\",\\\"\
            postback\\\":\\\"Visit Full\\\",\\\"url\\\":\\\"https://www.abcccccc.com/\\\
            \",\\\"webview\\\":\\\"Full\\\"}\"\n            },\n            {\n  \
            \              \"suggestion_type\": \"2\",\n                \"suggestion\"\
            : \"{\\\"displayText\\\":\\\"Visit Default\\\",\\\"postback\\\":\\\"Visit\
            \ Default\\\",\\\"url\\\":\\\"https://www.netcorecloud.com/\\\"}\"\n \
            \           },\n            {\n                \"suggestion_type\": \"\
            4\",\n                \"suggestion\": \"{\\\"displayText\\\":\\\"Get Location\\\
            \",\\\"postback\\\":\\\"Get Location\\\",\\\"latitude\\\":\\\"23.455\\\
            \",\\\"longitude\\\":\\\"54.566\\\",\\\"label\\\":\\\"Netcore\\\"}\"\n\
            \            }\n        ],\n        \"created_date\": \"2025-11-07 18:41:08\"\
            ,\n        \"updated_date\": \"2025-11-07 18:45:00\"\n    }\n}\n```\n"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                    description: Response status
                  message:
                    type: string
                    example: Data fetched successfully
                    description: Response message
                  template_id:
                    type: integer
                    example: 9753
                    description: The ID of the template
                  data:
                    type: object
                    properties:
                      template_name:
                        type: string
                        example: test_half
                        description: Name of the template
                      template_type:
                        type: string
                        example: text_message
                        description: Type of the template (e.g., text_message, carousel,
                          rich_card)
                      template_status:
                        type: string
                        example: auto-approved
                        description: Status of the template (e.g., approved, auto-approved,
                          pending)
                      template_content:
                        type: string
                        example: Hello welocme to netcore
                        description: Content/text of the template
                      orientation:
                        type: string
                        example: ''
                        description: Orientation of the template (vertical/horizontal)
                      alignment:
                        type: string
                        example: ''
                        description: Alignment of the template (left/right/center)
                      height:
                        type: string
                        example: ''
                        description: Height of the template (SHORT/MEDIUM/TALL)
                      width:
                        type: string
                        example: ''
                        description: Width of the template (SMALL/MEDIUM/LARGE)
                      suggestion_details:
                        type: array
                        description: Array of suggestion details for the template
                        items:
                          type: object
                          properties:
                            suggestion_type:
                              type: string
                              example: '2'
                              description: 'Type of suggestion:

                                1 = REPLY

                                2 = OPEN_URL

                                4 = SHOW_LOCATION

                                8 = OPEN_URL with dynamic attributes

                                '
                            suggestion:
                              type: string
                              example: '{"displayText":"Visit half","postback":"Visit
                                half","url":"https://www.netcorecloud.com/","webview":"Half"}'
                              description: 'JSON string containing suggestion details.
                                Structure varies by suggestion_type:

                                - Type 1 (REPLY): {"displayText":"...","postback":"..."}

                                - Type 2 (OPEN_URL): {"displayText":"...","postback":"...","url":"...","webview":"..."}

                                - Type 4 (SHOW_LOCATION): {"displayText":"...","postback":"...","latitude":"...","longitude":"...","label":"..."}

                                - Type 8 (OPEN_URL with dynamic): {"displayText":"...","postback":"...","url":"...","domain":"...","suggestionAttr":"...","webview":"..."}

                                '
                      created_date:
                        type: string
                        format: date-time
                        example: '2025-11-07 18:41:08'
                        description: Template creation date
                      updated_date:
                        type: string
                        format: date-time
                        example: '2025-11-07 18:45:00'
                        description: Template last update date
