                                index:
                                  type: string
                                  description: Button index (starting from 0).
                                  example: '0'
                                payload:
                                  type: string
                                  description: Payload value sent when button is clicked.
                                  example: '12345'
                                sub_type:
                                  type: string
                                  description: Type of button action.
                                  enum:
                                  - copy_code
                                  - url
