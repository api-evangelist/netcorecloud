            this webhook.
          example: cpaas_360
    BlocklistManagementRequest:
      type: object
      description: Defines the payload for blocklisting or whitelisting recipients.
      required:
      - type
      - recipients
      properties:
        type:
          type: string
          enum:
          - blocklist
          - whitelist
          description: Specifies whether to add or remove numbers from the blocklist.
          example: blocklist
        recipients:
          type: array
          description: Lists the recipients to block or whitelist.
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ConsentRecipient'
    ConsentRecipient:
      type: object
      description: Represents a single recipient’s consent or blocklist details.
      required:
      - recipient
      - source
      properties:
        recipient:
          type: string
          description: Phone number of the recipient including country code (6–15
            digits).
          pattern: ^[1-9][0-9]{5,14}$
          example: '919876543210'
        source:
          type: string
          description: Source from which the consent or blocklist request originated.
          enum:
          - WEB
          - MOBILE_APP
          - SMS_CAMPAIGN
          - IVR
          - EMAIL
          - RETAIL
          - CONTACT_CENTER
          - WHATSAPP_SESSION
          - API
          - ADMIN_PANEL
          - USER_REQUEST
          - COMPLIANCE
          - GDPR_REQUEST
          - SPAM_DETECTION
          - REGULATORY_COMPLIANCE
          - TESTING
          - DEVELOPMENT
          - OTHER
          example: WEB
        user_agent:
          type: string
          description: User agent string from the source device or application.
          maxLength: 500
          example: Mozilla/5.0 (Windows NT 10.0; Win64; x64)
        ip:
          type: string
          description: IP address from where the request originated.
          format: ipv4
          example: 192.168.7.26
    ConsentResponse:
      type: object
      description: Represents the standard success response for consent or blocklist
        actions.
      required:
      - status
      - message
      properties:
        status:
          type: string
          enum:
          - success
          - error
          description: Indicates success or failure of the request.
          example: success
        message:
          type: string
          description: Human-readable message about the response.
          example: Opt-in successfully added.
        data:
          type: object
          description: Contains operation result details.
          properties:
            processed_count:
              type: integer
              description: Number of recipients successfully processed.
              example: 1
            failed_count:
              type: integer
              description: Number of recipients that failed processing.
              example: 0
            failed_recipients:
              type: array
              description: List of recipients that failed processing.
              items:
                type: object
                properties:
                  recipient:
                    type: string
                    example: '919876543210'
                  error:
                    type: string
                    example: Invalid phone number format
    ConsentManagementRequest:
      type: object
      description: Defines the payload for managing user consent actions.
      required:
      - type
      - recipients
      properties:
        type:
          type: string
          enum:
          - optin
          - optout
          description: Specifies the consent action — opt-in or opt-out.
          example: optin
        recipients:
          type: array
          description: Lists the recipients whose consent will be managed.
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ConsentRecipient'
    ManageWebhookRequest:
      type: object
      required:
      - type
      - webhook_name
      - status
      properties:
        type:
          type: string
          enum:
          - incoming
          - event
          description: Select the webhook type you want to enable or disable.
          example: incoming
        webhook_name:
          type: string
          description: Enter the name of the webhook you want to manage.
          example: ChatBot_Webhook
        status:
          type: string
          enum:
          - enable
          - disable
          description: Set the new status for the webhook.
          example: enable
    WebhookOperationResponse:
      type: object
      required:
      - status
      - message
      properties:
        status:
          type: string
          enum:
          - success
          - failure
          description: Indicates if the operation was successful.
          example: success
        message:
          type: string
          description: Message describing the operation result.
          example: Webhook updated successfully.
        data:
          type: object
          description: Includes webhook operation details.
          properties:
            webhook_name:
              type: string
              example: ChatBot_Webhook
            type:
              type: string
              example: incoming
            status:
              type: string
              example: enabled
    PreviewTemplateSuccessResponse:
      type: object
      required:
      - status
      - message
      - preview_data
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Template preview generated successfully
        preview_data:
          type: object
          description: Template preview information
    RefundRequest:
      type: object
      description: Defines the payload required to initiate a refund.
      properties:
        reference_id:
          type: string
          description: Unique identifier for the refund request.
          example: '100'
        speed:
          type: string
          description: Determines refund processing speed.
          enum:
          - normal
          - instant
          example: normal
        payment_config_id:
          type: string
          description: Unique ID of the payment configuration used for the refund.
          example: vishal_test_10_10
        amount:
          type: object
          description: Defines refund amount details including offset.
          properties:
            currency:
              type: string
              description: Currency used for the refund (ISO 4217).
              example: INR
            value:
              type: integer
              description: Numeric value of the refund.
              example: 100
            offset:
              type: integer
              description: Value of any applied offset.
              example: 100
          required:
          - currency
          - value
          - offset
      required:
      - reference_id
      - speed
      - payment_config_id
      - amount
    RefundResponse:
      type: object
      description: Contains the refund initiation response details.
      properties:
        status:
          type: string
          description: Status of the API call.
          example: success
        message:
          type: string
          description: Description of the response result.
          example: Refund initiated successfully.
        data:
          type: object
          description: Provides information about the processed refund.
          properties:
            refund_id:
              type: string
              description: Unique ID of the refund transaction.
              example: '12345'
            reference_id:
              type: string
              description: Payment reference ID linked to the refund.
              example: '901003'
            amount_refunded:
              $ref: '#/components/schemas/PaymentStatusResponse/properties/data/properties/amount'
            speed:
              type: string
              description: Refund processing speed used.
              enum:
              - normal
              - instant
              example: normal
            timestamp:
              type: string
              format: date-time
              description: Date and time when the refund was processed.
              example: '2024-11-19T10:00:00Z'
          required:
          - refund_id
          - reference_id
          - amount_refunded
          - speed
          - timestamp
      required:
      - status
      - message
      - data
    PublishFlowSuccessResponse:
      type: object
      required:
      - status
      - message
      - data
      properties:
        status:
          type: string
          example: Success
        message:
          type: string
          example: Successfully Published Flow
        data:
          type: object
          required:
          - success
          properties:
            success:
              type: boolean
              example: true
    ConversionEventRequest:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          description: Array of conversion events to track
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ConversionEvent'
    ConversionEvent:
      type: object
      required:
      - event_name
      - event_time
      - action_source
      - messaging_channel
      - user_data
      properties:
        event_name:
          type: string
          description: Standard or custom event name
          enum:
          - Purchase
          - Lead
          - CompleteRegistration
          - Subscribe
          - StartTrial
          - AddToCart
          - InitiateCheckout
          - AddPaymentInfo
          - ViewContent
          - Contact
          - CustomizeProduct
          - Donate
          - FindLocation
          - Schedule
          - Search
          - SubmitApplication
          example: Purchase
        event_time:
          type: integer
          description: Event timestamp in Unix epoch time
          example: 1703876400
        action_source:
          type: string
          description: Source of the action
          enum:
          - business_messaging
          default: business_messaging
        messaging_channel:
          type: string
          description: Messaging platform
          enum:
          - whatsapp
          default: whatsapp
        user_data:
          $ref: '#/components/schemas/ConversionUserData'
        custom_data:
          $ref: '#/components/schemas/ConversionCustomData'
    ConversionUserData:
      type: object
      description: User identification data (at least one field required)
      properties:
        mobile_number:
          type: string
          description: Customer's mobile number with country code
          pattern: ^[1-9][0-9]{6,14}$
          example: '919876543210'
        ctwa_clid:
          type: string
          description: Click-to-WhatsApp Click ID for attribution
          example: AQAAAAACS5FpgQ_cAAAAAD0QI3s
    ConversionCustomData:
      type: object
      description: Additional event-specific data
      properties:
        currency:
          type: string
          description: Currency code for monetary events (ISO 4217)
          pattern: ^[A-Z]{3}$
          example: USD
        value:
          type: number
          description: Monetary value of the event
          minimum: 0
          example: 149.99
        content_ids:
          type: array
          description: Product or content identifiers
          items:
            type: string
          example:
          - PROD_12345
          - PROD_67890
        content_type:
          type: string
          description: Type of content
          enum:
          - product
          - product_group
          - service
          - article
          example: product
        order_id:
          type: string
          description: Unique order identifier
          example: ORDER_ABC123
        content_name:
          type: string
          description: Name of the content/product
          example: Premium Subscription
        content_category:
          type: string
          description: Category of the content/product
          example: Electronics
        num_items:
          type: integer
          description: Number of items in the event
          minimum: 1
          example: 2
        search_string:
          type: string
          description: Search query (for search events)
          example: wireless headphones
      additionalProperties: true
    ConversionResponse:
      type: object
      required:
      - status
      - message
      properties:
        status:
          type: string
          enum:
          - success
          example: success
        message:
          type: string
          example: Request processed successfully
        data:
          type: object
          properties:
            events_received:
              type: integer
              description: Number of events processed
              example: 1
            fbtrace_id:
              type: string
              description: Facebook trace ID for debugging
              example: AvuDhHGXLFxN8VAnWuV4E8o
    UpdateWebhookRequest:
      type: object
      required:
      - type
      - name
      - url
      - headers
      properties:
        type:
          type: string
          enum:
          - incoming
          - event
          description: Select whether the webhook is for incoming messages or event
            delivery.
          example: incoming
        name:
          type: string
          description: Enter a unique name for the webhook.
          maxLength: 50
          example: ChatBot_Webhook
        url:
          type: string
          format: uri
          description: Enter the destination URL to receive webhook payloads.
          example: https://api.example.com/webhook/incoming
        source:
          type: string
          description: Optionally specify the source or service that owns the webhook.
          maxLength: 100
          example: ChatBot_Service
        headers:
          type: string
          description: Provide custom headers in JSON format for webhook requests.
          example: '{"Content-Type": "application/json"}'
paths:
  /v3/metainfo/flow/list:
    get:
      summary: Fetch Flow List API
      tags:
      - WhatsApp Flows
      operationId: fetchFlowList
      description: 'Retrieves a list of WhatsApp Flows associated with a specific
        WABA (WhatsApp Business Account).


        ### Sample cURL Request


        ```bash

        curl --location --request GET ''https://cpaaswa.netcorecloud.net/api/v3/metainfo/flow/list''
        \

        --header ''Authorization: Bearer <your_bearer_token>''

        ```


        ### Paginated Example


        ```bash

        curl --location ''https://cpaaswa.netcorecloud.net/api/v3/metainfo/flow/list?pagination_token=QVFIUkR6WHRkcTV0MG...''
        \

        --header ''Authorization: Bearer <your_bearer_token>''

        ```

        '
      x-stoplight:
        id: wdg9xjisziypl
      parameters:
      - name: pagination_token
        in: query
        required: false
        description: Token for fetching the next page of results. Can be retrieved
          from the paging.cursors.after field of the response.
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved flow list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowListSuccessResponse'
              example:
                status: success
                message: Flow list fetched successfully!
                data:
                - categories:
                  - SHOPPING
                  id: '1097149801870954'
                  name: multi_product_native_shopping_flow_am
                  status: PUBLISHED
                  validation_errors: []
                - categories:
                  - LEAD_GENERATION
                  id: '726142859633434'
                  name: Udayan_8
                  status: PUBLISHED
                  validation_errors: []
                paging:
                  cursors:
                    after: QVFIUkR6WHRkcTV0MGtVSGwwLU5SN0...
                    before: QVFIUnRsZAE95OXVkaFk1YURfYm9m...
        '400':
          description: Bad Request - Invalid JWT Token
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    example: failure
                  message:
                    type: string
              example:
                status: failure
                message: invalid jwt token
        '500':
          description: Internal Server Error - Missing WABA ID or Redis Connection
            Error
          content:
            application/json:
              schema:
