          description: Webhook destination URL.
          example: https://echouat.netcorecloud.com/api/v1/bots/webhook
        failureAlertEmail:
          type: string
          format: email
          description: Email address for webhook failure alerts.
          example: admin@example.com
        status:
          type: string
          enum:
          - enabled
          - disabled
          description: Current webhook state.
          example: enabled
        type:
          type: string
          enum:
          - incoming
          - event
          description: Indicates whether the webhook is for incoming messages or events.
          example: incoming
        sourceKey:
          type: string
