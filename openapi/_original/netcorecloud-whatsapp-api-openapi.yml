info:
  title: WHATSAPP API
  version: '1.0'
  description: 'Comprehensive collection of WhatsApp APIs that allow users to interact
    with  WhatsApp Flows, Templates, Message Sending, Conversations, Consent Management,
    Webhooks, Payments, and Media associated with a specific WABA (WhatsApp Business
    Account).  These APIs communicate with Meta''s infrastructure to manage flow operations,  template
    creation, message sending, real-time conversations, user consent, webhook configuration,
    payment processing, media management, conversion tracking, and messaging workflows
    for business communication.

    **API Categories:** - **Flow Management**: Create, edit, publish, and manage WhatsApp
    Flows - **Template Management**: Create, delete, and preview message templates
    - **Message Sending**: Send various types of template messages including text,
    media, carousel, coupon, multi-product, and limited time offer templates - **Conversation
    Messages**: Real-time customer support within 24-hour window with Standard Messages
    (text, media, location, contact) and Interactive Messages (buttons, lists, flows,
    catalogs) - **Conversion Tracking**: Track customer interactions and conversions
    for improved ad targeting and performance measurement - **Consent Management**:
    Handle user opt-in/opt-out preferences, blocklist/whitelist management, and compliance
    tracking - **Webhook Management**: Configure, enable/disable, and update webhook
    endpoints for receiving events and incoming messages - **Payments**: Handle payment
    operations, order details, and refunds - **Media Management**: Upload and retrieve
    media files

    '
  license:
    name: Proprietary
    identifier: proprietary
servers:
- url: https://cpaaswa.netcorecloud.net/api
  description: WhatsApp APIs Server
- url: https://cpaaswa.netcorecloud.net
