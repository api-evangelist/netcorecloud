          content:
            application/json:
              schema:
                $ref: '#/paths/~1v3~1metainfo~1webhook~1list_webhook/get/responses/400/content/application~1json/schema'
  /v2/metainfo/webhook/manage_webhook:
    post:
      summary: Manage Webhook Status
      tags:
      - Webhook Management
      operationId: manageWebhook
      description: 'Use this API to enable or disable webhook endpoints without changing
        their configuration.


        **Status Options**

        - **enable** – Activate webhook to start receiving events.

        - **disable** – Temporarily pause webhook delivery.


        **Typical Use Cases**

        - Disable webhooks during maintenance.

        - Re-enable after testing or scaling down load.

        '
      parameters:
      - $ref: '#/paths/~1v3~1metainfo~1webhook~1update_webhook/post/parameters/0'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManageWebhookRequest'
            examples:
              EnableIncomingWebhook:
                summary: Enable Webhook
                description: Turn on an incoming message webhook.
                value:
                  type: incoming
                  webhook_name: ChatBot_Webhook
                  status: enable
              DisableEventWebhook:
                summary: Disable Webhook
                description: Turn off an event webhook temporarily.
                value:
                  type: event
                  webhook_name: Delivery_Events
                  status: disable
      responses:
        '200':
          description: "**Success Response**\n\nWebhook status updated successfully.\n\
            \n```json\n{\n  \"status\": \"success\",\n  \"message\": \"Webhook status\
            \ updated successfully.\",\n  \"data\": {\n    \"webhook_name\": \"ChatBot_Webhook\"\
            ,\n    \"status\": \"enabled\"\n  }\n}\n```\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookOperationResponse'
        '400':
          $ref: '#/paths/~1v3~1metainfo~1webhook~1list_webhook/get/responses/400'
        '401':
          $ref: '#/paths/~1v3~1metainfo~1webhook~1list_webhook/get/responses/401'
        '404':
          description: "**Webhook Not Found**\n\nThe specified webhook does not exist.\n\
            \n```json\n{\n  \"status\": \"failure\",\n  \"message\": \"Webhook not\
            \ found\"\n}\n```\n"
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v3~1metainfo~1webhook~1list_webhook/get/responses/400/content/application~1json/schema'
        '500':
