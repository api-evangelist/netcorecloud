  /v2/message/nc:
    post:
      tags:
      - Message Sending
      summary: Send Template Message
      operationId: sendTemplateMessage
      description: "Use this endpoint to send WhatsApp **template messages** (text,\
        \ media, coupon, carousel, product, order, interactive, LTO).  \nThe request\
        \ body structure determines the template type.\nBatching is supported: include\
        \ up to **100** messages in the `message` array per request.\n\n**Workflow**\n\
        1. Confirm user opt-in and template approval.  \n2. Build the payload using\
        \ the appropriate template structure.  \n3. Send the request and track delivery\
        \ via webhooks.\n"
      requestBody:
        required: true
        description: Provide the message payload. Use different sections based on
          template type.
        content:
          application/json:
            schema:
              type: object
              required:
              - message
              properties:
                message:
                  type: array
                  description: Add one or more message objects to send different WhatsApp
                    templates.
                  items:
                    type: object
                    required:
                    - recipient_type
                    - recipient_whatsapp
                    - source
                    properties:
                      recipient_type:
                        type: string
                        description: Enter the type of recipient (e.g., individual
                          or group).
                        example: individual
                      recipient_whatsapp:
                        type: string
                        description: Enter the recipient’s WhatsApp number in international
                          format.
                        example: '916267725099'
                      category:
                        type: string
                        description: Only valid for direct utility message sending.
                        example: utility
                      ttl_seconds:
                        type: integer
                        description: Optional. TTL for messages in seconds, only for
                          direct utility message sending.
                        example: 600
                      source:
                        type: string
                        description: Enter the source identifier for this message.
                        example: source-sample
                      cta_link_track:
                        type: string
                        description: Set **1** to enable CTA link tracking, or **0**
                          to disable.
                        example: '1'
                      retry_enabled:
                        type: string
                        description: Set **1** to enable message retry on temporary
                          failures, or **0** to disable. When enabled, the system
                          will automatically retry sending the message if it encounters
                          a transient error.
                        enum:
                        - '0'
                        - '1'
                        example: '1'
                      message_type:
                        type: string
                        description: Choose the WhatsApp message type to send (e.g.,
                          limited_time_offer_template, product_card_carousel_template,
                          interactive_template).
                        enum:
                        - text
                        - media
                        - template
                        - sms
                        - media_template
                        - location
                        - contacts
                        - interactive
                        - mpm_template
                        - catalog_template
                        - carousel_template
                        - order_details_template
                        - order_status_template
                        - typing_indicator
                        - product_card_carousel_template
                        - spm_template
                        - limited_time_offer_template
                        - call_permission_request
                        example: limited_time_offer_template
                      x-apiheader:
                        type: string
                        description: Enter custom header text used for routing or
                          authentication.
                        example: netcore_api_header
                      type_template:
                        type: array
                        description: Add template details such as name, placeholders,
                          and language.
                        items:
                          type: object
                          required:
                          - name
                          - language
                          properties:
                            name:
                              type: string
                              description: Name of the template.
                              example: lto_template_image_qa_2_3
                            attributes:
                              type: array
                              description: Template parameters to replace placeholders.
                              items:
                                type: string
                              example:
                              - something
                              - everything
                              - https://www.amazon.com
                            language:
                              type: object
                              description: Language and policy settings for the template.
                              required:
                              - locale
                              - policy
                              properties:
                                locale:
                                  type: string
                                  description: Locale of the message.
                                  example: en
                                policy:
                                  type: string
                                  description: Language fallback policy.
                                  example: deterministic
                      type_media_template:
                        type: object
                        description: Media content and metadata for LTO message.
                        required:
                        - type
                        properties:
                          type:
                            type: string
                            description: Media type (e.g., image, video).
                            example: image
                          url:
                            type: string
                            format: uri
                            description: Public URL of the media file.
                            example: https://cpaas-media-us.s3.us-east-1.amazonaws.com/whatsapp-media-stage/Web%201920%20%E2%80%93%203_20251014130024_1760446824780.jpeg
                          media_id:
                            type: string
                            description: Media ID of the media file.
                            example: '731736671839227'
                          filename:
                            type: string
                            description: Filename of the media file.
                            example: document.pdf
                          button:
