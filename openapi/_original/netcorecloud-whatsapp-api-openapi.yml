  /v3/metainfo/flow/create:
    post:
      summary: Create Flow API
      tags:
      - WhatsApp Flows
      operationId: createFlow
      description: "The **Create Flow API** allows you to create interactive WhatsApp\
        \ flows using Meta's flow builder JSON structure. \nThis API accepts flow\
        \ configuration details such as flow name, categories, and a valid flow JSON\
        \ string. \nOptionally, flows can be published immediately upon creation.\
        \ It is used to build dynamic, guided experiences \nfor WhatsApp users, such\
        \ as onboarding journeys, service requests, or feedback forms.\n"
      parameters:
      - name: Content-Type
        in: header
        required: true
        description: Must be set to 'application/json' to indicate JSON-formatted
          request body.
        schema:
          type: string
          example: application/json
      requestBody:
        required: true
        description: All necessary parameters should be passed in the request body
          in JSON format.
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - categories
              - flow_json
              properties:
                name:
                  type: string
                  description: Name of the flow.
                categories:
                  type: array
                  description: Categories to which the flow belongs.
                  items:
                    type: string
                flow_json:
                  type: string
                  description: JSON string representing the WhatsApp flow structure.
                publish:
                  type: boolean
                  description: Whether to publish the flow immediately. Values can
                    be 'true' or 'false'. Default value is 'false'.
            example:
              name: My first flow
              categories:
              - OTHER
              flow_json: '{"version":"5.0","screens":[{"id":"WELCOME_SCREEN","layout":{"type":"SingleColumnLayout","children":[{"type":"TextHeading","text":"Hello
                World"},{"type":"Footer","label":"Complete","on-click-action":{"name":"complete","payload":{}}}]},"title":"Welcome","terminal":true,"success":true,"data":{}}]}'
              publish: true
      responses:
        '200':
          description: Successfully created flow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateFlowSuccessResponse'
              example:
                status: Successfull
                message: Flow Created Successfully
                data:
                  id: '1292530015172565'
                  success: true
        '400':
          description: Bad Request - Missing Data or Invalid JWT Token
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v3~1metainfo~1flow~1list/get/responses/400/content/application~1json/schema'
              examples:
                missing_data:
                  summary: Missing or Invalid Data
                  value:
                    status: Failure
                    message: Please Provide Data to Create Flow
                invalid_jwt:
                  summary: Invalid JWT Token
                  value:
                    status: failure
                    message: invalid jwt token
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v3~1metainfo~1flow~1list/get/responses/400/content/application~1json/schema'
              example:
                status: failure
                message: Internal Server Error
        4XX:
          description: Meta Flow Creation Error
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v3~1metainfo~1flow~1edit/post/responses/4XX/content/application~1json/schema'
              example:
                status: failure
                message: Failed to Create Flow
                Data: {}
    parameters: []
  /v3/metainfo/flow/edit:
    post:
      summary: Edit Flow with JSON File API
      tags:
      - WhatsApp Flows
      operationId: editFlowWithJSON
      description: Updates an existing WhatsApp flow by uploading a new flow definition
        as a JSON file via multipart/form-data.
      parameters:
      - name: Content-Type
        in: header
        required: true
        description: Must be set to multipart/form-data for file upload.
        schema:
          type: string
          example: multipart/form-data
      - name: flowid
        in: query
        required: true
        description: The unique ID of the flow.
        schema:
          type: string
      requestBody:
        required: true
        description: 'JSON file containing the updated flow definition. Must be valid
          Meta Flow JSON.


          ### Sample cURL Request


          ```bash

          curl --location ''https://cpaaswa.netcorecloud.net/api/v3/metainfo/flow/edit?flowid=674833981710003''
          \

          --header ''Authorization: Bearer <your_bearer_token>'' \

          --form ''file=@"/path/to/file.json"''

          ```


          Note: Ensure that the file is properly formatted and uses Meta''s WhatsApp
          Flow JSON schema.

          '
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: JSON file containing the updated flow definition. Must
                    be valid Meta Flow JSON.
      responses:
        '200':
          description: Successfully edited flow with JSON file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditFlowSuccessResponse'
              example:
                status: Success
                message: Successfully edited Flow
                data:
                  success: true
        '400':
          description: Bad Request - Missing or Invalid Data
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v3~1metainfo~1flow~1list/get/responses/400/content/application~1json/schema'
              example:
                status: failure
                message: flow_id is required
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v3~1metainfo~1flow~1list/get/responses/400/content/application~1json/schema'
              example:
                status: failure
                message: Internal Server Error
        4XX:
          description: Meta Flow Update Error
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    example: failure
                  message:
                    type: string
                    example: Failed to Publish Flow
                  Data:
                    type: object
                    description: Meta-specific error details
                    additionalProperties: true
              example:
                status: failure
                message: Meta API responded with error
                Data: {}
    parameters: []
  /v2/payments/configuration/oauth_link:
    post:
      operationId: createOAuthLink
      summary: Generate OAuth Link for Payment Configuration
      description: "Generate an OAuth link for payment gateway configuration. This\
        \ endpoint creates an authorization URL \nthat redirects to the payment gateway's\
        \ OAuth flow, allowing businesses to connect their payment \naccounts and\
        \ configure payment settings.\n"
      tags:
      - WhatsApp Payments
      parameters:
      - $ref: '#/paths/~1v2~1payments~1configuration/post/parameters/0'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Request payload for generating OAuth link
              properties:
                configuration_name:
                  type: string
                  description: Unique name for the payment configuration. This will
                    be used to identify and manage the payment gateway setup.
                  example: ravi
                redirect_url:
                  type: string
                  format: uri
                  description: The URL where users will be redirected after completing
                    the OAuth authorization flow. This must be a valid HTTPS URL registered
                    with the payment gateway.
                  example: https://example.pepipostravi.com/oauth
              required:
              - configuration_name
              - redirect_url
            examples:
              oauth_link_request:
                summary: Generate OAuth link for payment configuration
                value:
                  configuration_name: ravi
                  redirect_url: https://example.pepipostravi.com/oauth
      responses:
        '200':
          description: OAuth link generated successfully
          content:
            application/json:
              schema:
                type: object
                description: Response containing OAuth link information
                properties:
                  status:
                    type: string
                    description: Overall status of the API call
                    example: success
                  message:
                    type: string
                    description: Human-readable message about the operation
                    example: OAuth link generated successfully
                  data:
                    type: object
                    description: OAuth link data details
                    properties:
                      oauth_url:
                        type: string
                        format: uri
                        description: The OAuth authorization URL that should be opened
                          in a browser to complete the payment gateway configuration
                        example: https://oauth.payment.gateway.com/authorize?client_id=xxx&redirect_uri=https://example.pepipostravi.com/oauth&response_type=code&state=xxx
                      configuration_name:
                        type: string
                        description: The configuration name used in the request
                        example: ravi
                    required:
                    - oauth_url
                    - configuration_name
                required:
                - status
                - message
                - data
              examples:
                success:
                  summary: Successful OAuth link generation
                  value:
                    status: success
                    message: OAuth link generated successfully
                    data:
                      oauth_url: https://oauth.payment.gateway.com/authorize?client_id=xxx&redirect_uri=https://example.pepipostravi.com/oauth&response_type=code&state=xxx
                      configuration_name: ravi
        '400':
          $ref: '#/paths/~1v2~1payments~1configuration/post/responses/400'
        4XX:
          $ref: '#/paths/~1v2~1payments~1configuration/post/responses/4XX'
  /v2/payments/configuration:
    post:
      operationId: createPaymentConfiguration
      summary: Create Payment Configuration
      description: "Create a new payment gateway configuration for WhatsApp payments.\
        \ This endpoint allows businesses to \nset up payment providers (such as PayU,\
        \ RazorPay, etc.) with OAuth-based authentication and \nrequired merchant\
        \ details for processing payments through WhatsApp.\n"
      tags:
      - WhatsApp Payments
      parameters:
      - name: Content-Type
        in: header
        required: true
        schema:
          type: string
          enum:
          - application/json
        description: Defines the content type of the request body. Must be application/json.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Request payload for creating a payment gateway configuration
              properties:
                configuration_name:
                  type: string
                  description: Unique name for the payment configuration. This identifier
                    will be used to reference the configuration in payment operations.
                  example: ravi_test2
                provider_name:
                  type: string
                  description: Name of the payment gateway provider (e.g., PayU, RazorPay,
                    etc.)
                  example: PayU
                redirect_url:
                  type: string
                  format: uri
                  description: The callback URL where users will be redirected after
                    completing OAuth authentication with the payment provider. Must
                    be a valid HTTPS URL.
                  example: https://exampleravi.com/oauth
                merchant_category_code:
                  type: string
                  description: Merchant Category Code (MCC) for the business. Used
                    to classify the type of business and transactions.
                  example: '0000'
                purpose_code:
                  type: string
                  description: Purpose code indicating the nature of the payment transaction
                    as per regulatory requirements.
                  example: '00'
                merchant_vpa:
                  type: string
                  description: Merchant VPA for UPI payments.
                  example: rohanagarwalaxis@sksk
              required:
              - configuration_name
              - provider_name
              - merchant_category_code
              - purpose_code
            examples:
              payu_configuration:
                summary: Create PayU payment configuration
                value:
                  configuration_name: ravi_test2
                  provider_name: PayU
                  redirect_url: https://exampleravi.com/oauth
                  merchant_category_code: '0000'
                  purpose_code: '00'
              upi_configuration:
                summary: Create UPI payment configuration
                value:
                  configuration_name: ravi_test2
                  provider_name: PayU
                  merchant_category_code: '0000'
                  purpose_code: '00'
                  merchant_vpa: rohanagarwalaxis@sksk
      responses:
        '200':
          description: Payment configuration created successfully
          content:
            application/json:
              schema:
                type: object
                description: Response containing payment configuration information
                properties:
                  status:
                    type: string
                    description: Overall status of the API call
                    example: success
                  message:
                    type: string
                    description: Human-readable message about the operation
                    example: Payment configuration created successfully
                  data:
                    type: object
                    description: Payment configuration data details
                    properties:
                      configuration_name:
                        type: string
                        description: The configuration name used in the request
                        example: ravi_test2
                      provider_name:
                        type: string
                        description: Name of the payment gateway provider
                        example: PayU
                      redirect_url:
                        type: string
                        format: uri
                        description: The redirect URL configured for OAuth callback
                        example: https://exampleravi.com/oauth
                      merchant_category_code:
                        type: string
                        description: Merchant Category Code configured for the payment
                          gateway
                        example: '0000'
                      purpose_code:
                        type: string
                        description: Purpose code configured for the payment gateway
                        example: '00'
                      status:
                        type: string
                        description: Current status of the payment configuration
                        enum:
                        - active
                        - pending
                        - inactive
                        example: active
                    required:
                    - configuration_name
                    - provider_name
                    - redirect_url
                    - merchant_category_code
                    - purpose_code
                    - status
                required:
                - status
                - message
                - data
              examples:
                success:
                  summary: Successful configuration creation
                  value:
                    status: success
                    message: Payment configuration created successfully
                    data:
                      configuration_name: ravi_test2
                      provider_name: PayU
                      redirect_url: https://exampleravi.com/oauth
                      merchant_category_code: '0000'
                      purpose_code: '00'
                      status: active
                upi_configuration:
                  summary: Create UPI payment configuration
                  value:
                    status: success
                    message: Payment configuration created successfully
                    data:
                      configuration_name: ravi_test2
                      provider_name: PayU
                      redirect_url: https://exampleravi.com/oauth
                      merchant_category_code: '0000'
                      purpose_code: '00'
                      merchant_vpa: rohanagarwalaxis@sksk
        '400':
          description: The request is invalid or malformed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
                    example: Invalid Request
              examples:
                invalid_request:
                  summary: Bad request example
                  value:
                    error_message: Invalid Request
        4XX:
          description: A generic error occurred while processing the request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
                    example: Message
              examples:
                generic:
                  summary: Generic error
                  value:
                    error_message: Message
  /v3/metainfo/template/list:
    get:
      summary: Fetch Template List API
      tags:
      - WhatsApp Templates
      operationId: fetchTemplateList
      description: 'Retrieve a list of WhatsApp templates with support for filtering,
        sorting, and pagination. This API allows you to filter templates by status,
        name, language, and type to efficiently manage your template library.

        '
      parameters:
      - name: Content-Type
        in: header
        required: true
        description: Must be set to 'application/json' for JSON requests.
        schema:
          type: string
          example: application/json
      - name: status
        in: query
        required: false
        description: Filter templates by their approval status. Example - approved,
          rejected.
        schema:
          type: string
          enum:
          - approved
          - rejected
          - pending
      - name: template_name
        in: query
        required: false
        description: Filter templates using a partial or full match of the template
          name.
        schema:
          type: string
      - name: language
        in: query
        required: false
        description: Filter templates by language. Example - English, Hindi.
        schema:
          type: string
      - name: template_type
        in: query
        required: false
        description: Filter templates by type. Comma-separated values like 1,2.
        schema:
          type: string
      - name: offset
        in: query
        required: false
        description: Number of records to skip for pagination.
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        required: false
        description: Maximum number of records to return.
        schema:
          type: integer
          default: 10
      responses:
        '200':
          description: Successfully retrieved template list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateListSuccessResponse'
        '400':
          description: Bad Request - Template specific error
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    example: failure
                  message:
                    type: string
                    description: Error description
                  error_code:
                    type: string
                    description: Specific error code
                  details:
                    type: object
                    description: Additional error details
              example:
                status: failure
                message: Invalid template parameters
        '401':
          description: Unauthorized - Invalid token
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v3~1metainfo~1template~1list/get/responses/400/content/application~1json/schema'
              example:
                status: failure
                message: Invalid or expired authentication token
        '500':
          description: Internal Server Error - Template API error
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v3~1metainfo~1template~1list/get/responses/400/content/application~1json/schema'
              example:
                status: failure
                message: Internal server error occurred
