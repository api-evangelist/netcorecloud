        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookRequest'
            examples:
              IncomingWebhook:
                summary: Incoming Webhook
                description: Create or update a webhook to receive customer messages.
                value:
                  type: incoming
                  name: ChatBot_Webhook
                  url: https://api.example.com/webhook/incoming
                  source: ChatBot_Service
                  headers: '{"Content-Type": "application/json"}'
              EventWebhook:
                summary: Event Webhook
                description: Create or update a webhook to receive delivery events.
                value:
                  type: event
                  name: Delivery_Events
                  url: https://api.example.com/webhook/events
                  source: Analytics_Service
                  headers: '{"X-API-Key": "your_api_key"}'
      responses:
        '200':
          description: "**Success Response**\n\nWebhook configuration updated successfully.\n\
            \n```json\n{\n  \"status\": \"success\",\n  \"message\": \"Webhook updated\
