  /v3/metainfo/webhook/list_webhook:
    get:
      summary: List Webhooks
      tags:
      - Webhook Management
      operationId: listWebhooks
      description: 'Use this API to retrieve all configured webhooks based on type.


        **Webhook Types**

        - **incoming** – For chatbot and incoming message handling.

        - **event** – For delivery event notifications like sent, read, or failed.


        The response includes webhook name, URL, status, alert email, and type.

        '
      parameters:
      - name: type
        in: query
        required: true
        schema:
          type: string
          enum:
          - incoming
          - event
        description: Enter the webhook type to retrieve.
        example: incoming
      responses:
        '200':
          description: "**Success Response**\n\nWebhooks retrieved successfully.\n\
            \n```json\n[\n  {\n    \"name\": \"ChatBot_Webhook\",\n    \"urlEndpoint\"\
            : \"https://api.example.com/webhook/incoming\",\n    \"failureAlertEmail\"\
            : \"admin@example.com\",\n    \"status\": \"enabled\",\n    \"type\":\
            \ \"incoming\",\n    \"sourceKey\": \"chatbot_service\"\n  }\n]\n```\n"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookInfo'
        '400':
          description: "**Bad Request**\n\nThe request body or parameters are invalid.\n\
            \n```json\n{\n  \"status\": \"failure\",\n  \"message\": \"Invalid webhook\
            \ type. Must be 'incoming' or 'event'\"\n}\n```\n"
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - failure
                    - error
                    description: Defines the response as a failure or error.
                    example: failure
                  message:
                    type: string
                    description: Explains the reason for the error.
                    example: Webhook not found
                  details:
                    type: object
                    description: Optional additional information about the error.
                    additionalProperties: true
        '401':
          description: "**Unauthorized**\n\nMissing or invalid Bearer token.\n\n```json\n\
            {\n  \"status\": \"failure\",\n  \"message\": \"Invalid Bearer token\"\
            \n}\n```\n"
          content:
