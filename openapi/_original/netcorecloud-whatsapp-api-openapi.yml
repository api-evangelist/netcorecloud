  /v3/metainfo/webhook/update_webhook:
    post:
      summary: Update Webhook Configuration
      tags:
      - Webhook Management
      operationId: updateWebhook
      description: "Use this API to create or update webhook configurations.  \nSet\
        \ the webhook URL, custom headers, and alert email settings.\n\n**Limits**\n\
        - Up to **3 incoming** and **5 event** webhooks.\n"
