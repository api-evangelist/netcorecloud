      description: "Use this API to add or remove phone numbers from the blocklist\
        \ or whitelist.  \nControl message delivery to ensure compliance and prevent\
        \ unwanted communication.\n\n**When to Blocklist:**\n- Users request no communication\
        \  \n- Repeated delivery failures or bounces  \n- Compliance or regulatory\
        \ requirements  \n- Spam prevention and internal testing\n\n**When to Whitelist:**\n\
        - Re-enable blocked users  \n- Prioritize VIP or testing numbers  \n- Allow\
        \ emergency or system notifications\n\n**Features:**\n- Bulk operations supported\
        \  \n- Source tracking for audit purposes  \n- Integration with consent workflows\
        \  \n- GDPR-compliant data handling\n"
