  /v3/metainfo/flow/preview:
    get:
      summary: Generate Flow Preview URL API
      tags:
      - WhatsApp Flows
      operationId: generateFlowPreviewURL
      description: "To retrieve a preview URL for a specific WhatsApp Flow using Meta's\
        \ Flows API, you can make an HTTP GET request \nto the designated endpoint.\
        \ This allows you to visualize and interact with the flow before deploying\
        \ it to end users, \nfacilitating testing and validation of the flow's functionality\
        \ and user experience.\n\nFor detailed instructions on generating a web preview\
        \ URL, refer to Meta's official documentation: \nhttps://developers.facebook.com/docs/whatsapp/flows/reference/flowsapi\n"
      parameters:
      - name: flow_id
        in: query
        required: true
        description: Unique identifier assigned to each WhatsApp Flow.
        schema:
          type: string
      responses:
        '200':
          description: Successfully generated flow preview URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowPreviewSuccessResponse'
              example:
                status: success
                message: Flow preview fetched successfully!
                data:
                  preview_url: https://business.facebook.com/wa/manage/flows/1097149801870954/preview/?token=2919d2eb-7d0f-4cf7-8b22-3b9f79fe3679
                  expires_at: 2025-04-19T11:27:54+0000
                  flow_id: '1097149801870954'
        '400':
          description: Bad Request - Missing Flow ID or Invalid JWT Token
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v3~1metainfo~1flow~1list/get/responses/400/content/application~1json/schema'
              examples:
                missing_flow_id:
                  summary: Missing Flow ID
                  value:
                    status: failure
                    message: flow_id is required
                invalid_jwt:
                  summary: Invalid JWT Token
                  value:
                    status: failure
                    message: invalid jwt token
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v3~1metainfo~1flow~1list/get/responses/400/content/application~1json/schema'
              example:
                status: failure
                message: INTERNAL SERVER ERROR
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v3~1metainfo~1flow~1list/get/responses/400/content/application~1json/schema'
              example:
                status: failure
                message: Service temporarily unavailable. Please try again later.
    parameters: []
