    post:
      summary: Track Customer Conversions (CAPI)
      tags:
      - Conversion Tracking
      operationId: trackConversions
      description: 'The Conversions API (CAPI) allows businesses to send data about
        key customer interactions and conversions from WhatsApp conversations to Meta
        for improved ad targeting and performance measurement.

        '
      parameters:
      - name: Content-Type
        in: header
        required: true
        description: Must be set to application/json to indicate JSON-formatted request
          body
        schema:
          type: string
          example: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversionEventRequest'
            examples:
              LeadSubmittedEvent:
                summary: Lead Generation Event
                description: Track when customer submits lead form
                value:
                  data:
                  - event_name: Lead
                    event_time: 1703876400
                    action_source: business_messaging
                    messaging_channel: whatsapp
                    user_data:
                      mobile_number: '919876543210'
                      ctwa_clid: AQAAAAACS5FpgQ_cAAAAAD0QI3s
                    custom_data:
                      lead_type: product_inquiry
                      product_category: electronics
              PurchaseEvent:
                summary: Purchase Conversion Event
                description: Track successful purchase transactions
                value:
                  data:
                  - event_name: Purchase
                    event_time: 1703876400
                    action_source: business_messaging
                    messaging_channel: whatsapp
                    user_data:
                      mobile_number: '919876543210'
                      ctwa_clid: AQAAAAACS5FpgQ_cAAAAAD0QI3s
