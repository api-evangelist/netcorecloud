                          parameters:
                            type: object
                            properties:
                              display_text:
                                type: string
                              url:
                                type: string
                            required:
                            - display_text
                            - url
                        required:
                        - name
                        - parameters
                        additionalProperties: false
                    required:
                    - type
                    - body
                    - action
                    example:
                      type: interactive
                      interactive:
                        type: cta_url
                        header:
                          type: text
                          text: <HEADER_TEXT>
                        body:
                          text: <BODY_TEXT>
                        footer:
                          text: <FOOTER_TEXT>
                        action:
                          name: cta_url
                          parameters:
                            display_text: <BUTTON_TEXT>
                            url: <BUTTON_URL>
                required:
                - type
                - interactive
              - title: Interactive Reply Buttons
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - interactive
                  interactive:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - button
                      header:
                        type: object
                        properties:
                          type:
                            type: string
                            enum:
                            - text
                          text:
                            type: string
                      body:
                        type: object
                        properties:
                          text:
                            type: string
                        required:
                        - text
                      footer:
                        type: object
                        properties:
                          text:
                            type: string
                      action:
                        type: object
                        properties:
                          buttons:
                            type: array
                            items:
                              type: object
                              properties:
