  /v3/metainfo/message_samples:
    post:
      summary: Upload Message Samples API
      tags:
      - Message Samples
      operationId: uploadMessageSamples
      description: 'Use this API to upload message samples to onboard for direct utility
        message sending.

        The request body structure determines the template type.

        Batching is supported: include up to **100** messages in the `message` array
        per request.

        '
      parameters:
      - name: Content-Type
        in: header
        required: true
        description: Must be set to 'application/json' for JSON requests.
        schema:
          type: string
          example: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
              - title: Text message
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - text
                  text:
                    type: object
                    properties:
                      body:
                        type: string
                    required:
                    - body
                required:
                - type
                - text
                example:
                  type: text
                  text:
                    body: <BODY_TEXT>
              - title: Interactive CTA URL
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - interactive
                  interactive:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - cta_url
                      header:
                        type: object
                        properties:
                          type:
                            type: string
